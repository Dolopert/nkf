<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- CC 9 ต.ค. 69 (TASK_cc_billbox_share · รอบ 3): หน้าเพื่อน (F) — เปิดจากลิงก์ ไม่ต้องสมัคร · เห็นเฉพาะบิลนั้น · ติ๊กได้อย่างเดียว
     ไม่มีสคริปต์ inline (CSP ห้าม) · คุยกับ DB ผ่านฟังก์ชัน bill_share_view/join/set_ticks (anon) เท่านั้น — ไม่มีตารางใดเปิดให้ anon
     build → web/b/index.html (+ b/sb_config.js จาก .env · anon key = สาธารณะอยู่แล้ว) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#141419">
<title>บิลแชร์ · NongKept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#141419;--card:#1e1e24;--bd:#31313a;--bd2:#26262e;--bd3:#43434d;--inset:#101014;
    --tx:#f2f2f6;--mut:#a9a9b4;--dim:#75757f;--cy:#65dcff;--cy2:#8fe8ff;--grn:#7ee2a8;--grn3:#9ae2b5;--red2:#ffb4b4;--amb2:#f5b943;
    --cy-bg:rgba(101,220,255,.07);--cy-bd:rgba(101,220,255,.42);--cy-bd2:rgba(101,220,255,.62);
    --grn-bg:rgba(34,197,94,.06);--grn-bd:rgba(34,197,94,.4);--grn-bd2:rgba(34,197,94,.5);--red-bg:rgba(255,143,143,.07);--red-bd2:rgba(255,143,143,.55);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f6f7f9;--card:#ffffff;--bd:#e2e6ec;--bd2:#e7eaef;--bd3:#c8d2dd;--inset:#f1f3f7;--tx:#191a1f;--mut:#5d6470;--dim:#7d8490;
      --cy2:#0b7f9e;--grn:#157f47;--grn3:#157f47;--red2:#b91c1c;--amb2:#b45309;--cy-bg:rgba(11,127,158,.08);--cy-bd:rgba(11,127,158,.35);--cy-bd2:rgba(11,127,158,.55);
      --grn-bg:rgba(21,127,71,.09);--grn-bd:rgba(21,127,71,.35);--grn-bd2:rgba(21,127,71,.5);--red-bg:rgba(204,61,61,.08);--red-bd2:rgba(204,61,61,.5);color-scheme:light}
  }
  html,body{background:var(--bg);color:var(--tx);font-family:'Kanit',system-ui,sans-serif;font-size:14px}
  body{max-width:480px;margin:0 auto;padding:12px 14px calc(170px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px;border-bottom:1px solid var(--bd2);margin-bottom:12px}
  .logo{font-weight:700;font-size:16px}
  .logo .p{font-size:9px;font-weight:700;background:var(--cy);color:#062026;border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:3px}
  .date{font-size:10.5px;color:var(--mut)}
  .h{font-size:15px;font-weight:700;line-height:1.45}
  .s{font-size:11px;color:var(--mut);margin:3px 0 12px;line-height:1.6}
  .s b{color:var(--tx)}
  .card{border:1px solid var(--bd);border-radius:16px;background:var(--card);padding:12px 13px;margin-bottom:10px}
  .lbl{font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{border:1px solid var(--bd3);background:var(--inset);color:var(--tx);border-radius:99px;padding:8px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .in{width:100%;background:var(--inset);border:1px solid var(--bd2);border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:10px 12px;outline:none}
  .in:focus{border-color:var(--cy)}
  .btn{width:100%;margin-top:10px;background:var(--cy);border:1px solid var(--cy);color:#062026;font:inherit;font-weight:700;border-radius:14px;padding:12px 0;font-size:14px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--cy2);border-color:var(--cy-bd)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .it{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid var(--bd2);border-radius:14px;background:var(--inset);padding:11px 13px;margin-bottom:7px;color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
  .it .ck{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--bd3);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#062026}
  .it .nm{flex:1;min-width:0;font-weight:600}
  .it .who{font-size:10.5px;border:1px solid var(--bd3);border-radius:99px;padding:2px 9px;color:var(--mut);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .pr{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
  .it.mine{border-color:var(--grn-bd2);background:var(--grn-bg)}
  .it.mine .ck{background:var(--grn);border-color:var(--grn)}
  .it.mine .who{border-color:var(--grn-bd2);color:var(--grn3)}
  .it.other{opacity:.55;cursor:default}
  .it[disabled]{cursor:default}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 80%,transparent)}
  .bar .box{max-width:452px;margin:0 auto;border:1px solid var(--cy-bd2);border-radius:16px;background:var(--card);padding:11px 13px}
  .bar .t1{font-size:11px;color:var(--mut);line-height:1.55}
  .bar .t2{font-size:15px;font-weight:700;margin-top:3px}
  .bar .t2 b{color:var(--grn);font-size:19px}
  .bar .btn{margin-top:8px}
  .note{font-size:10.5px;color:var(--dim);margin:10px 2px;line-height:1.6}
  .msg{border:1px solid var(--bd2);border-radius:14px;background:var(--inset);padding:14px;font-size:12.5px;line-height:1.7;color:var(--mut);text-align:center}
  .lock{border:1px solid var(--grn-bd2);background:var(--grn-bg);border-radius:14px;padding:11px 13px;font-size:12px;line-height:1.6;margin-bottom:10px}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#123324;color:#effff5;border-radius:12px;padding:9px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;z-index:9}
  .toast.on{opacity:1}
  .toast.err{background:#3a1d1d;color:#ffd9d9}
  .foot{font-size:10px;color:var(--dim);text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="top"><span class="logo">NongKept<span class="p">บิลแชร์</span></span><span class="date" id="today"></span></div>
<div id="app"><div class="msg">กำลังเปิดบิล…</div></div>
<div class="bar" id="bar" style="display:none"></div>
<div class="toast" id="toast"></div>
<script src="../assets/vendor/supabase-js.js"></script>
<script src="sb_config.js"></script>
<script src="../assets/billshare_calc.js"></script>
<script src="share.js"></script>
</body>
</html>
