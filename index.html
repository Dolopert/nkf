<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="tcMeta" content="#141419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NongKept">
<script>
/* แก้โดย Hermes 4 ต.ค. 69 (P เคาะ): ธีม มืด/สว่าง — ตั้งก่อนวาดจอ กันจอวาบ + อัปเดตแถบสีเบราว์เซอร์ */
(function(){
  var t = '';
  try { t = localStorage.getItem('nkf_theme') || ''; } catch(e){}
  if (t !== 'light' && t !== 'dark')
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#f6f7f9' : '#141419');
})();
</script>
<title>NongKept · FullAuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{ /* โทนมืด = Charcoal · โทนสว่าง = Daylight (แก้โดย Hermes 4 ต.ค. 69 · P เคาะเธรด 🛒fullauto — เดิมดำสนิท #070707) */
    --bg:#141419;--card:#1e1e24;--card2:#28282f;--bd:#31313a;--bd2:#26262e;--bd3:#43434d;
    --inset:#101014;--track:#0c0c10;
    --topbg:rgba(20,20,25,.92);--tabbg:rgba(22,22,27,.96);--ovl:rgba(3,3,5,.62);
    --tx:#f2f2f6;--mut:#a9a9b4;--dim:#75757f;
    --cy:#65dcff;--cy2:#8fe8ff;--grn:#7ee2a8;--grn2:#22c55e;--grn3:#9ae2b5;--grn4:#effff5;
    --amb:#f5b943;--amb2:#f5b943;--red:#ff8f8f;--red2:#ffb4b4;
    --cy-bg:rgba(101,220,255,.07);--cy-bg2:rgba(101,220,255,.15);--cy-bg3:rgba(101,220,255,.3);
    --cy-bd:rgba(101,220,255,.42);--cy-bd2:rgba(101,220,255,.62);
    --amb-bg:rgba(245,185,67,.07);--amb-bg2:rgba(245,185,67,.15);--amb-bg3:rgba(245,185,67,.3);
    --amb-bd:rgba(245,185,67,.42);--amb-bd2:rgba(245,185,67,.6);
    --grn-bg:rgba(34,197,94,.06);--grn-bd:rgba(34,197,94,.4);--grn-bd2:rgba(34,197,94,.5);
    --red-bg:rgba(255,143,143,.07);--red-bd:rgba(255,143,143,.5);--red-bd2:rgba(255,143,143,.55);
    --toastbg:#123324;--toastbtn-bg:rgba(255,255,255,.14);--toastbtn-bd:rgba(255,255,255,.28);
    --errbg:#3a1d1d;--chipsd:0 1px 5px #000b;--dtg1:#23232a;--dtg2:#1a1a20;
    color-scheme:dark;
  }
  html[data-theme="light"]{
    --bg:#f6f7f9;--card:#ffffff;--card2:#e6eaef;--bd:#e2e6ec;--bd2:#e7eaef;--bd3:#c8d2dd;
    --inset:#f1f3f7;--track:#e9edf2;
    --topbg:rgba(246,247,249,.92);--tabbg:rgba(248,249,252,.96);--ovl:rgba(15,23,42,.35);
    --tx:#191a1f;--mut:#5d6470;--dim:#7d8490;
    --cy:#65dcff;--cy2:#0b7f9e;--grn:#157f47;--grn2:#16a34a;--grn3:#157f47;--grn4:#14532d;
    --amb:#f5b943;--amb2:#b45309;--red:#cc3d3d;--red2:#b91c1c;
    --cy-bg:rgba(11,127,158,.08);--cy-bg2:rgba(11,127,158,.13);--cy-bg3:rgba(11,127,158,.22);
    --cy-bd:rgba(11,127,158,.35);--cy-bd2:rgba(11,127,158,.55);
    --amb-bg:rgba(180,83,9,.08);--amb-bg2:rgba(180,83,9,.14);--amb-bg3:rgba(180,83,9,.22);
    --amb-bd:rgba(180,83,9,.38);--amb-bd2:rgba(180,83,9,.55);
    --grn-bg:rgba(21,127,71,.09);--grn-bd:rgba(21,127,71,.35);--grn-bd2:rgba(21,127,71,.5);
    --red-bg:rgba(204,61,61,.08);--red-bd:rgba(204,61,61,.45);--red-bd2:rgba(204,61,61,.5);
    --toastbg:#e6f6ec;--toastbtn-bg:rgba(20,83,45,.08);--toastbtn-bd:rgba(20,83,45,.25);
    --errbg:#fdecec;--chipsd:0 1px 5px rgba(15,23,42,.14);--dtg1:#ffffff;--dtg2:#f2f4f8;
    color-scheme:light;
  }
  html,body{height:100%;overscroll-behavior:none}
  html{background:var(--bg)} /* กันแถบขาวด้านบน/โอเวอร์สกรอลล์ — ดำเต็มขอบ */
  body{background:var(--bg);color:var(--tx);
    font-family:'SF Pro Display','SF Pro Text','Kanit','Tahoma','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.4;
    display:flex;flex-direction:column;
    position:fixed;inset:0;width:100%;overflow:hidden;
    touch-action:manipulation} /* ล็อกกรอบแอปกับจอ (กันเลื่อนแล้วโผล่แถบขาว) + กันดับเบิลแทปซูม */
  body::before{content:'';position:fixed;inset:0;background:var(--bg);z-index:-1} /* ประกันพื้นดำเต็มจอ */
  button,input,.cg,.item,.nv,.miniact,.btn-cy,.incbtns button,.renbox button{touch-action:manipulation}
  .wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;height:100%}
  /* ---------- top bar ---------- */
  .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;
    padding-top:calc(14px + env(safe-area-inset-top));background:var(--topbg);backdrop-filter:blur(8px)}
  .logo{font-size:16px;font-weight:700;letter-spacing:.2px}
  .logo .p{font-size:9.5px;font-weight:700;color:#062026;background:var(--cy);border-radius:99px;padding:2px 7px;margin-left:7px;vertical-align:2.5px;letter-spacing:.3px}
  .top .right{display:flex;align-items:center;gap:8px}
  .date{font-size:11px;color:var(--mut)}
  .iconbtn{width:34px;height:34px;border-radius:12px;background:var(--card);border:1px solid var(--bd2);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .iconbtn:active{background:var(--card2)}
  .iconbtn.spin svg{animation:sp 1s linear infinite}
  /* ปุ่มสลับธีม: ไอคอนโชว์ตามโหมด (พระอาทิตย์ = กดไปโหมดสว่าง · พระจันทร์ = กดไปโหมดมืด) */
  #btnTheme .i-moon{display:none}
  html[data-theme="light"] #btnTheme .i-sun{display:none}
  html[data-theme="light"] #btnTheme .i-moon{display:block}
  @keyframes sp{to{transform:rotate(360deg)}}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 24px;overscroll-behavior:contain}
  .tabpane{display:none}
  .tabpane.on{display:block}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px 15px;margin-bottom:9px}
  .hero .lbl{font-size:11.5px;color:var(--mut)}
  .hero .amt{font-size:30px;font-weight:650;letter-spacing:.2px;font-variant-numeric:tabular-nums;margin-top:2px}
  .hero .sub{font-size:11px;color:var(--dim);margin-top:3px}
  .hero .sub b{font-weight:600}
  .gr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .gr-head .t{font-size:11.5px;color:var(--mut);font-weight:600}
  .gr-head .r{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .gr{display:block;width:100%;height:auto}
  .xlab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);padding:3px 2px 0;font-variant-numeric:tabular-nums}
  .gr-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:7px;font-variant-numeric:tabular-nums}
  .gr-foot b{color:var(--tx);font-weight:600}
  .pend{display:flex;align-items:center;gap:11px;background:var(--amb-bg);border:1px solid var(--amb-bd);border-radius:18px;padding:12px 15px;margin-bottom:9px}
  .pend .e{font-size:17px}
  .pend .txt{flex:1;min-width:0}
  .pend .txt .t1{font-size:13px;font-weight:600}
  .pend .txt .t2{font-size:11px;color:var(--mut);margin-top:1px;font-variant-numeric:tabular-nums}
  .btn-cy{background:var(--cy);border:1px solid var(--cy);color:#062026;font-weight:700;border-radius:12px;padding:8px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .btn-cy:active{box-shadow:0 0 0 3px rgba(101,220,255,.16)}
  .sec-t{font-size:11.5px;color:var(--mut);font-weight:600;margin:12px 3px 8px}
  .list-hd{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
  .list-hd .l .t1{font-size:13.5px;font-weight:700}
  .list-hd .l .t2{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
  /* แก้โดย Hermes 4 ต.ค. 69 (P สั่ง · เธรด): ประวัติรายการ — หัวเดือนแยกส่วน (แต่ละเดือนเรียงของตัวเอง) */
  .mgroup-t{display:flex;justify-content:space-between;align-items:baseline;margin:6px 3px 8px;padding-top:10px;border-top:1px solid var(--bd2)}
  .mgroup-t .mt{font-size:12.5px;font-weight:700;letter-spacing:.2px}
  .mgroup-t .mn{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .list-hd + .mgroup-t{border-top:none;padding-top:2px;margin-top:0}
  /* แก้โดย Hermes 5 ต.ค. 69 (P สั่ง · เธรด "หน้ารอยืนยัน"): ชิปเลือกเดือน — แท็บรอยืนยันแยกเดือน ไม่ปนกัน */
  .pchips{display:flex;gap:7px;margin:2px 2px 10px;flex-wrap:wrap}
  .pchip{background:transparent;border:1px solid var(--bd2);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums}
  .pchip.on{background:var(--cy-bg2);border-color:var(--cy-bd2);color:var(--cy2)}
  .pchip:active{border-color:var(--bd3)}
  /* แก้โดย Hermes 5 ต.ค. 69 (P สั่ง · เธรด "ปุ่มเปิด-ปิดรายการย่อยใน TrueMoney"): สวิตช์ติดตามรายการย่อยของกระเป๋า + โหมดสรุป */
  .trkcard{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0 4px}
  .trkcard .ic{width:30px;height:30px;border-radius:9px;background:var(--inset);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .trkcard .mid{flex:1;min-width:0}
  .trkcard .nm{font-size:12.5px;font-weight:600;color:var(--tx)}
  .trkcard .sub{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.55}
  .tmsw{width:46px;height:27px;border-radius:99px;border:1px solid var(--bd2);background:var(--inset);position:relative;flex:none;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
  .tmsw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
  .tmsw.on{background:var(--cy-bg2);border-color:var(--cy-bd2)}
  .tmsw.on i{left:22px;background:var(--cy2)}
  .trknote{border:1px dashed var(--bd2);border-radius:12px;padding:9px 11px;margin:2px 0 8px;font-size:10.5px;color:var(--mut);line-height:1.7}
  /* ---------- swipe row (iOS Clock style: ปัดได้เลย เด้งนุ่ม ไม่ต้องกดค้าง) ---------- */
  .swrow{position:relative;margin-bottom:8px;border-radius:16px;overflow:hidden;touch-action:pan-y;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .swact{position:absolute;top:0;bottom:0;width:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:none;font-family:inherit;cursor:pointer;font-size:11px;font-weight:600}
  .swact.del{right:0;background:var(--amb-bg2);color:var(--amb2);border-radius:0 16px 16px 0}
  .swact.del:active{background:var(--amb-bg3)}
  .swact.save{left:0;background:var(--cy-bg2);color:var(--cy2);border-radius:16px 0 0 16px}
  .swact.save:active{background:var(--cy-bg3)}
  .swact i{font-style:normal;font-size:15px}
  .swrow .item{position:relative;z-index:2;margin-bottom:0;background:var(--card)}
  /* ---------- items ---------- */
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
  .item:active{border-color:var(--bd3);background:var(--card2)}
  .item.open{align-items:flex-start;border-color:var(--bd3);background:var(--card2);flex-wrap:wrap}
  .icw{width:35px;height:35px;border-radius:12px;background:var(--inset);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .item.open .icw{margin-top:1px}
  .mid{flex:1;min-width:0}
  .mid .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .rt{text-align:right;flex:none}
  .amt{font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--red)}
  .amt.in{color:var(--grn)}
  .rt .cchip{font-size:9.5px;color:var(--mut);margin-top:3px}
  .rt .cchip.done{color:var(--grn3);font-weight:600}
  .rt .cchip.amber{color:var(--amb2);font-weight:600}
  .chev{color:var(--dim);font-size:17px;flex:none;padding-left:2px;line-height:1}
  .hint{font-size:11px;color:var(--dim);margin:3px 3px 13px;line-height:1.55}
  .hint b{color:var(--mut);font-weight:600}
  .empty{text-align:center;color:var(--dim);font-size:12.5px;padding:38px 10px;line-height:1.8}
  /* ---------- บล็อกกางเต็มความกว้าง (กริดอยู่กลางการ์ด) ---------- */
  .exp{flex-basis:100%;width:100%;margin-top:10px}
  .catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:340px;margin:0 auto}
  .cg{position:relative;background:var(--inset);border:1px solid var(--bd2);border-radius:13px;padding:8px 3px 7px;text-align:center;
    font-size:10px;color:var(--tx);cursor:pointer;transition:.13s;line-height:1.25;-webkit-tap-highlight-color:transparent}
  .cg:active{background:var(--card2);border-color:var(--bd3)}
  .cg i{display:block;font-size:16.5px;font-style:normal;margin-bottom:2.5px}
  .cg.more{color:var(--mut)}
  .cg.sug{border-color:var(--amb-bd2);background:var(--amb-bg2)}
  .cg.cur{border-color:var(--cy-bd2);background:var(--cy-bg)}  /* แก้โดย Hermes 4 ต.ค. 69: หมวดปัจจุบันของแถวที่บันทึกแล้ว */
  .cg .st{position:absolute;top:4px;right:6px;font-size:8.5px;color:var(--amb2);line-height:1}
  .cg .st.cur{color:var(--cy2)}
  .sgdot{font-size:9px;color:var(--amb2);margin-top:3px;font-weight:600}
  /* ---------- บิลรอเงินคืน ---------- */
  .billbox{margin-top:10px;padding:9px 11px;border:1px solid var(--bd2);border-radius:12px;background:var(--inset);font-size:11px}
  .billbox .bt{color:var(--mut);line-height:1.5}
  .billbox .bt b{color:var(--amb2);font-weight:700}
  .billbox.open{border-color:var(--amb-bd)}
  .billbox.done{border-color:var(--grn-bd);color:var(--grn3)}
  .billbox.flat{color:var(--dim)}
  /* CC 9 ต.ค. 69 (TASK_cc_bill_return_app2 ข้อ B): แถวจัดสรร "แยกเอง" ในแผงเงินเข้า */
  .msprow{display:flex;gap:8px;align-items:center;margin-top:7px}
  .msprow .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
  .msprow input{width:104px;flex:none;box-sizing:border-box;background:var(--card,var(--inset));border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-size:16px;padding:6px 9px;font-family:inherit;outline:none;text-align:right}
  .msprow input:focus{border-color:var(--cy)}
  /* ---------- Hermes 8 ต.ค. 69 (วงเงินเข้า · P เคาะ 7 ต.ค. 69): แผงยืนยันเงินเข้าตรวจอัตโนมัติ (แบบม็อก moneyin-tidy) ---------- */
  .pm-box{margin-top:10px;padding:10px 12px;border:1px solid var(--bd2);border-radius:12px;background:var(--inset);font-size:11.5px;color:var(--mut);line-height:1.65}
  .pm-box b{color:var(--tx)}
  .pm-box .big{font-size:15px;font-weight:700;color:var(--grn);margin-bottom:3px}
  .pm-lbl{font-size:11px;color:var(--mut);font-weight:600;margin:10px 2px 6px}
  .ps-inp{width:100%;box-sizing:border-box;background:var(--inset);border:1px solid var(--bd2);border-radius:11px;color:var(--tx);font-size:16px;padding:9px 12px;font-family:inherit;outline:none}
  .ps-inp:focus{border-color:var(--cy)}
  .brow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 2px;border-top:1px solid var(--bd2);align-items:baseline}
  .gr-head + .brow{border-top:none}
  .brow .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .r{color:var(--amb2);flex:none;font-variant-numeric:tabular-nums;font-weight:600}
  .brow .ok{color:var(--grn3);font-weight:600}
  .incbtns{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
  /* แก้โดย Hermes 7 ต.ค. 69 (v4.2.8+ · P เคาะแบบ ก): "รายการของฉัน" = แถวเดียวเลื่อนแนวนอน */
  .recscroll{display:flex;gap:7px;overflow-x:auto;padding:1px 2px 5px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 84%,transparent);mask-image:linear-gradient(90deg,#000 84%,transparent)}
  .recscroll::-webkit-scrollbar{display:none}
  .recscroll .miniact{flex:none}
  .incbtns .save{background:var(--cy);border:1px solid var(--cy);color:#062026;font-weight:700;border-radius:11px;padding:8px 14px;font-size:12px;font-family:inherit;cursor:pointer}
  .incbtns .cancel{background:transparent;border:1px solid var(--bd);color:var(--mut);border-radius:11px;padding:8px 12px;font-size:12px;font-family:inherit;cursor:pointer}
  .incform{margin-top:9px}
  .incform input{width:100%;background:var(--inset);border:1px solid var(--bd2);border-radius:11px;color:var(--tx);
    font-size:16px;padding:8px 11px;font-family:inherit;outline:none;margin-bottom:7px;-webkit-user-select:text;user-select:text}
  .incform input:focus{border-color:var(--cy)}
  .incrow{display:flex;gap:7px}
  .incrow input{flex:1}
  .miniact.cy2{color:var(--cy2);border-color:var(--cy-bd)}
  .rowacts{display:flex;gap:7px;margin-top:10px;justify-content:center}
  .miniact{background:transparent;border:1px solid var(--bd2);color:var(--mut);border-radius:10px;padding:6px 11px;font-size:10.5px;font-family:inherit;cursor:pointer}
  .miniact:active{border-color:var(--bd3);color:var(--tx)}
  .renbox{display:flex;gap:7px;margin-top:2px}
  .renbox input{flex:1;min-width:0;background:var(--inset);border:1px solid var(--cy);border-radius:11px;color:var(--tx);

function fmtBaht(minor){
  var s = String(Math.round(Math.abs(minor)));
  while (s.length < 3) s = '0' + s;
  var whole = s.slice(0, s.length-2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (minor < 0 ? '-' : '') + whole + '.' + s.slice(s.length-2);
}
function fmtWhen(at){
  if (!at || at.length < 16) return at || '';
  var d = parseInt(at.slice(8,10),10), m = parseInt(at.slice(5,7),10);
  return d + ' ' + TH_M[m-1] + ' ' + at.slice(11,16);
}
function fmtDay(dstr){
  var d = parseInt(dstr.slice(8,10),10), m = parseInt(dstr.slice(5,7),10);
  return d + ' ' + TH_M[m-1];
}

// logic ต้องตรงกับ TH_DOW/weeklyDueDate/weeklyDotDays ใน bridge/supabase_bridge.js (เดโม่ไม่มี bridge จึงเขียนซ้ำ — แก้ต้องแก้คู่)
// dow 0=อาทิตย์ … 6=เสาร์ (= getDay() = ลำดับหัวปฏิทิน อา จ อ พ พฤ ศ ส)
var TH_DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
var TH_DOW_S = ['อา','จ','อ','พ','พฤ','ศ','ส'];
function recDowOk(dow){ return dow !== null && dow !== '' && dow !== undefined && /^[0-6]$/.test(String(dow)); }
// งวดนี้ = วัน dow ที่ใกล้สุดย้อนหลัง ≤ todayStr ('YYYY-MM-DD') — คิดผ่าน Date.UTC (ปี/เดือน/วันจริง ข้ามเดือน/ปีถูก) · ไม่ถูกต้อง → ''
function weeklyDueDate(dow, todayStr){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(todayStr || ''));
  if (!m || !recDowOk(dow)) return '';
  var t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  var c = new Date(t - ((new Date(t).getUTCDay() - Number(dow) + 7) % 7) * 86400000);
  var mo = String(c.getUTCMonth() + 1), dd = String(c.getUTCDate());
  return c.getUTCFullYear() + '-' + (mo.length < 2 ? '0' + mo : mo) + '-' + (dd.length < 2 ? '0' + dd : dd);
}
function weeklyDotDays(dow, y, m){  // m = 1..12 → วันในเดือนที่ตรง dow
  var out = []; if (!recDowOk(dow)) return out;
  var dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (var d = 1; d <= dim; d++) if (new Date(Date.UTC(y, m - 1, d)).getUTCDay() === Number(dow)) out.push(d);
  return out;
}
function recDtLine(f, full){
  var now = new Date();
  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): รายสัปดาห์ → "(วันนี้) · ทุกวันเสาร์ · งวดนี้ 3 ต.ค." (งวด = f.due จาก bridge · ไม่มี = คิดจากวันนี้)
  if (f.freq === 'weekly'){
    if (!recDowOk(f.dow)) return 'ทุกสัปดาห์ · ยังไม่เลือกวัน';
    var due = f.due || weeklyDueDate(f.dow, todayISO());
    var wd = 'ทุกวัน' + TH_DOW[Number(f.dow)] + ' · งวดนี้ ' + fmtDayShort(due);
    if (due === todayISO()) wd = '(วันนี้) · ' + wd;
    if (full){
      if (f.status === 'done' && f.date) wd += ' · ' + (f.dir === 'in' ? 'รับ ' : 'จ่าย ') + fmtDayShort(f.date);
      if (f.spent_minor > 0) wd += ' · ใช้แล้ว ฿' + fmtBaht(f.spent_minor);
    }
    return wd;
  }
  var yearly = f.freq === 'yearly' && f.month_of_year >= 1 && f.month_of_year <= 12;
  var dt = yearly
    ? 'ครบ ' + f.day + ' ' + TH_M[f.month_of_year - 1] + ' · ทุกปี'
    : 'ครบ ' + f.day + ' ' + TH_M[now.getMonth()];
  var isToday = Number(f.day) === now.getDate() && (!yearly || f.month_of_year === now.getMonth() + 1);
  if (isToday) dt = '(วันนี้) · ' + dt;
  if (full){
    if (f.status === 'done' && f.date) dt += ' · ' + (f.dir === 'in' ? 'รับ ' : 'จ่าย ') + fmtDayShort(f.date);
    if (f.spent_minor > 0) dt += ' · ใช้แล้ว ฿' + fmtBaht(f.spent_minor);
  }
  return dt;
}

  var names = [];

  var f = S.budForm; if (!f) return;

  var v = parseBahtMinor(f.amt);
  var cats = f.cats.slice(0);
  var label = String(f.label || '').replace(/\s+/g, ' ').trim().slice(0, 60);
  if (!label) label = 'งบ' + cats.map(function(c){ return catMeta(c).t; }).join('/');
  var emoji = f.emoji || (catMeta(cats[0]) || {}).e || '';
  var key = f.key || ('ub-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4)).replace(/[^a-z0-9\-_]/g, '');
  var daysIn = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
  var snap = JSON.parse(JSON.stringify(f));
  S.budForm = null;
  if (IS_DEMO){
    var list = S.data.budgets = S.data.budgets || [];
    var row = null;
    for (var i = 0; i < list.length; i++) if (list[i].key === key) row = list[i];
    if (!row){ row = { key: key, spent_minor: 0, day: 0, overlap: false }; list.push(row); }
    row.label = label; row.emoji = emoji; row.cats = cats;
    row.per_day = (f.mode === 'day') ? v : 0;
    row.cap_minor = (f.mode === 'day') ? v * daysIn : v;
    budRecalcRow(row);
    budRecalcTotals();
    paint();
    toast(f.key ? 'แก้ไขงบแล้ว ✓' : 'เพิ่มงบแล้ว ✓');

    cap_per_day: (f.mode === 'day') ? v : 0, cap_minor: (f.mode === 'day') ? 0 : v }],
    f.key ? 'แก้ไขงบแล้ว ✓' : 'เพิ่มงบแล้ว ✓', function(){
      if (!S.budForm){ S.budForm = snap; S.tab = 2; paint(); }  // บันทึกไม่สำเร็จ — เปิดฟอร์มคืน (แบบ recSave)
    });

function budRecalcRow(row){
  row.remain_minor = Math.max(0, (row.cap_minor || 0) - (row.spent_minor || 0));
  row.over_minor = Math.max(0, (row.spent_minor || 0) - (row.cap_minor || 0));
  row.pct = row.cap_minor > 0 ? Math.round(row.spent_minor / row.cap_minor * 100) : 0;

function budRecalcTotals(){
  var t = { spent_minor: 0, cap_minor: 0 };
  ((S.data && S.data.budgets) || []).forEach(function(b){ t.spent_minor += (b.spent_minor || 0); t.cap_minor += (b.cap_minor || 0); });

function budDel(key){
  var list = (S.data && S.data.budgets) || [];
  var b = null;
  for (var i = 0; i < list.length; i++) if (list[i].key === key) b = list[i];
  if (!b) return;

  budRecalcTotals();

function sumDaily(arr){ var t=0; for(var i=0;i<arr.length;i++) t+=arr[i].n; return t; }
function graphPeak(arr){
  var mx=-1, mi=0;
  for (var i=0;i<arr.length;i++) if (arr[i].n > mx) { mx = arr[i].n; mi = i; }
  return mx > 0 ? ('สูงสุด ฿' + fmtBaht(mx) + ' · ' + fmtDay(arr[mi].d)) : '';
}
function xlabels(arr){
  var out = [];

  }

function buildGraph(daily){
  var vals = daily.map(function(x){ return x.n; });
  var W=370, H=112, PL=22, PT=12, PB=16, n=vals.length;
  if (n < 2) return '';
  var vmax = Math.max.apply(null, vals.concat([1])) * 1.18;
  var xs=[], ys=[];
  for (var i=0;i<n;i++){ xs.push(PL + i*(W-PL*2)/(n-1)); ys.push(PT + (1 - vals[i]/vmax)*(H-PT-PB)); }
  function cr(p0,p1,p2,p3){
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    return 'C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  var pts=[]; for (var k=0;k<n;k++) pts.push([xs[k],ys[k]]);
  var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+' ';
  for (var j=0;j<n-1;j++) d+=cr(pts[Math.max(0,j-1)], pts[j], pts[j+1], pts[Math.min(n-1,j+2)])+' ';
  var area = d + 'L'+pts[n-1][0].toFixed(1)+','+(H-3)+' L'+pts[0][0].toFixed(1)+','+(H-3)+' Z';
  var last = pts[n-1], gid = 'gg' + Math.random().toString(36).slice(2,7);
  return '<svg class="gr" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#65dcff" stop-opacity=".26"/><stop offset="1" stop-color="#65dcff" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="'+area+'" fill="url(#'+gid+')"/>'
    + '<path d="'+d+'" fill="none" stroke="#65dcff" stroke-width="2.4" stroke-linecap="round"/>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.6" style="fill:var(--bg)" stroke="#65dcff" stroke-width="2.2"/>'
    + '</svg>';
}

function billOwnTxt(amount, expect){

function moneyInToBill(ref, billRef){

  if (S.miBill) delete S.miBill[ref];
  it.status = 'skipped';

}
/* ============ แก้โดย CC 9 ต.ค. 69 (TASK_cc_bill_return_app2 ข้อ B · P เคาะ "ทำต่อเลย"): "แยกเอง" — เงินเข้าก้อนเดียว (เงินคืน + รายรับปนกัน)

/* proposal: (i) ยอด ≤ remaining (บิลใหม่สุดที่รับได้) → ทั้งก้อนเข้าบิลนั้น · (ii) เกิน remaining → เลือกบิลที่ส่วนต่าง "สะอาด" (เต็มร้อย > เต็มบาท)
   ไม่มีก็บิลใหม่สุด · ส่วนเกิน → รายรับ · (iii) ไม่มีบิล → รายรับทั้งหมด */
function mspPropose(amount, bills){
  var out = { bills: {}, inc: 0, skip: 0 };
  if (!(amount > 0)) return out;
  var bl = (bills || []).filter(function(b){ return (b.remaining_minor || 0) > 0; });
  if (!bl.length){ out.inc = amount; return out; }
  var best = null, bestTier = 9;
  for (var i = 0; i < bl.length; i++){
    var rem = bl[i].remaining_minor, diff = amount - rem;
    var tier = diff <= 0 ? 0 : (diff % 10000 === 0 ? 1 : (diff % 100 === 0 ? 2 : 3));
    if (tier < bestTier){ best = bl[i]; bestTier = tier; }
  }
  var put = Math.min(amount, best.remaining_minor);
  out.bills[best.ref] = put;
  out.inc = amount - put;
  return out;
}
function mspTxt(minor){ return minor > 0 ? ((minor % 100 === 0) ? String(minor / 100) : (minor / 100).toFixed(2)) : ''; }
function mspFill(ref, prop){
  var f = {};
  for (var k in prop.bills) f['b:' + k] = mspTxt(prop.bills[k]);
  f.inc = mspTxt(prop.inc); f.skip = mspTxt(prop.skip);
  if (!S.miSplit) S.miSplit = {};
  S.miSplit[ref] = f;
}
function mspOpen(ref){
  var it = findItem(ref); if (!it || it.kind !== 'money_in_check') return;
  if (S.miBill) delete S.miBill[ref];
  mspFill(ref, mspPropose(it.amount_minor, mspBills()));
  paint();
}
function mspCalc(it){
  var f = (S.miSplit && S.miSplit[it.ref]) || {};
  var bl = mspBills(), sum = 0, err = '', parts = [];
  function val(k){
    var s = String(f[k] || '').trim();
    if (!s) return 0;
    var v = parseBahtMinor(s);
    if (!(v > 0) && !err) err = 'ตัวเลขไม่ถูกต้อง';
    return v;
  }
  bl.forEach(function(b){
    var v = val('b:' + b.ref);
    if (!(v > 0)) return;
    if (v > b.remaining_minor && !err) err = 'เกินยอดที่เหลือของบิล ' + shortName({ counterparty: b.name }) + ' (' + fmtBaht(b.remaining_minor) + '฿)';
    parts.push({ t: 'bill', ref: b.ref, name: b.name, v: v }); sum += v;
  });
  var inc = val('inc'), skip = val('skip');
  if (inc > 0){ parts.push({ t: 'inc', v: inc }); sum += inc; }
  if (skip > 0){ parts.push({ t: 'skip', v: skip }); sum += skip; }
  var left = it.amount_minor - sum;
  if (!err && left < 0) err = 'จัดสรรเกินยอดเงินเข้า ' + fmtBaht(-left) + '฿';
  if (!err && left > 0) err = 'ยังเหลือต้องจัดสรร';
  return { parts: parts, sum: sum, left: left, inc: inc, skip: skip, err: err, ok: !err };
}
function mspLeftHtml(c){
  return 'เหลือ <b>' + (c.left < 0 ? '−' : '') + fmtBaht(Math.abs(c.left)) + '฿</b>' + (c.err ? ' · <span style="color:var(--red2)">' + esc(c.err) + '</span>' : ' · พร้อมบันทึก ✓');
}
function mspBlock(it){

    + row('inc', '💰 รายรับ (ชื่อตามช่องด้านบน)')

    + '<button class="cancel" data-act="mspCancel" data-ref="' + esc(ref) + '">ยกเลิก</button></div></div>';
}
function mspInput(t){

function mspChip(ref, billRef){   // ชิป: ทั้งหมดเป็นรายรับ / คืนเต็มบิล X (ที่เหลือ → รายรับ)
  var it = findItem(ref); if (!it || !S.miSplit) return;

function mspSave(ref){
  var it = findItem(ref); if (!it || it.kind !== 'money_in_check' || !S.miSplit || !S.miSplit[ref]) return;

  var inp = el('miName');
  var label = inp ? String(inp.value || '').replace(/\s+/g, ' ').trim() : '';
  if (c.inc > 0 && !label){ toast('ใส่ชื่อรายการก่อนนะ', true); return; }
  var billsOut = [];
  c.parts.forEach(function(p){
    if (p.t !== 'bill') return;
    billsOut.push({ ref: p.ref, amount_minor: p.v });
    var bit = findItem(p.ref), b = null;
    (S.data.bills || []).forEach(function(x){ if (x.ref === p.ref) b = x; });
    if (bit){
      bit.bill_returned = (bit.bill_returned || 0) + p.v;
      if (bit.bill_returned >= bit.bill_expect) bit.bill_status = 'done';
      billUpsertLocal(p.ref);
    } else if (b){
      b.returned_minor = (b.returned_minor || 0) + p.v;
      b.remaining_minor = Math.max(0, b.expect_minor - b.returned_minor);
      if (b.remaining_minor === 0) b.status = 'done';
    }
  });
  if (c.inc > 0){   // ส่วนรายรับ = แถวรายรับใหม่ยอดเท่าที่จัดสรร (แนวเดียวกับ confirmIncome) — แถวเงินเข้าเดิม → skipped
    S.data.history.unshift({ at: it.at, ref: ref + '-IN', kind: 'manual_in', direction: 'in', amount_minor: c.inc, counterparty: label,
      status: 'saved', category: 'income', saved_at: '', display_name: '', bill_expect: 0, bill_returned: 0, bill_status: '' });
    S.data.meta.savedCount = (S.data.meta.savedCount || 0) + 1;
    if ((it.at || '').slice(0, 7) === curMonthKey()) S.data.summary.monthIncome = (S.data.summary.monthIncome || 0) + c.inc;
    S.data.summary.cashflow = (S.data.summary.monthIncome || 0) - (S.data.summary.monthSpent || 0);

  S.open[ref] = false; S.ext[ref] = false;
  recalcSummary(); paint();
  var back = billsOut.reduce(function(a, x){ return a + x.amount_minor; }, 0);
  toast('แบ่งแล้ว: เงินคืน ' + billsOut.length + ' บิล ' + fmtBaht(back) + '฿' + (c.inc > 0 ? ' · รายรับ ' + fmtBaht(c.inc) + '฿' : '') + (c.skip > 0 ? ' · ข้าม ' + fmtBaht(c.skip) + '฿' : ''));

function categoryGrid(d, it){

  var saved = (it.status === 'saved');

  //   'personal' (ค่าใช้จ่ายส่วนตัว) อยู่ในชุดหลักแทนแล้ว · 'income' โผล่เฉพาะแถว "เงินเข้า" (และไม่โผล่ในหน้า อื่นๆ ของรายจ่าย)
  var mains = (it.direction === 'in') ? (['income'].concat(d.main.filter(function(s2){ return s2 !== 'income'; }))) : d.main;
  var cells = mains.map(function(slug){

/* แก้โดย Hermes 4 ต.ค. 69 (P สั่ง · เธรด "ประวัติรายการ"): 3 อย่าง —
   ① แถวบันทึกแล้วแตะแก้ได้ (หมวด/ชื่อ) ② แยกเดือน (เดิมรวมทุกเดือนเป็นลิสต์เดียว) ③ ในแต่ละเดือนเรียง "เวลาล่าสุดขึ้นก่อน"
   — แต่ละเดือนเรียงของตัวเอง ไม่รวมเป็นก้อนเดียว · เดือนล่าสุดขึ้นก่อน */
function histMonths(d){
  var groups = {}, order = [];
  for (var i = 0; i < d.history.length; i++){
    var mk = (d.history[i].at || '').slice(0, 7);
    if (!groups[mk]) { groups[mk] = []; order.push(mk); }
    groups[mk].push(d.history[i]);
  }
  order.sort(function(a, b){ return a > b ? -1 : (a < b ? 1 : 0); }); // เดือนล่าสุดก่อน
  return { groups: groups, order: order };
}
/* CC 10 ต.ค. 69 (TASK_cc_histmonth_v1 · P เคาะ ①): แสดงทีละเดือน + แถบ ‹ › (แบบหน้ารายละเอียดเดือน) */
function htmlHistory(d){
  if (!d.history.length) return '<div class="empty">ยังไม่มีรายการที่บันทึก — ปัดขวาหรือกดหมวดได้เลย</div>';
  var mm = histMonths(d);
  if (!mm.groups[S.hMonth]) S.hMonth = mm.order[0];   // ยังไม่เลือก/เดือนเดิมหาย → เดือนล่าสุด
  var idx = mm.order.indexOf(S.hMonth);
  var older = mm.order[idx + 1], newer = mm.order[idx - 1];
  var items = mm.groups[S.hMonth].slice().sort(function(a, b){ return a.at > b.at ? -1 : (a.at < b.at ? 1 : 0); }); // ในเดือนนี้: ล่าสุดขึ้นก่อน
  var out = '<div class="list-hd"><div class="l"><div class="t1">ประวัติรายการ</div>'
    + '<div class="t2">บันทึกแล้ว '+d.meta.savedCount+' รายการ · '+mm.order.length+' เดือน · แตะแถวเพื่อแก้หมวด/ชื่อ</div></div></div>';
  out += '<div class="mpick" style="margin-bottom:10px">'
    + '<button data-act="hstep" data-d="1"' + (older ? '' : ' style="opacity:.3"') + '><svg><use href="#i-back"/></svg></button>'
    + '<b>' + monthLabelOf(S.hMonth) + '<span class="mct"> · ' + items.length + ' รายการ</span></b>'
    + '<button data-act="hstep" data-d="-1"' + (newer ? '' : ' style="opacity:.3"') + '><svg><use href="#i-next"/></svg></button></div>';

  if (d.meta.savedCount > d.history.length) out += '<div class="hint" style="margin:4px 3px">แสดง '+d.history.length+' รายการล่าสุด · ทั้งหมดที่บันทึก '+d.meta.savedCount+' รายการ</div>';

/* ---------- swipe (iOS Clock style: ตามนิ้วทันที เด้งนุ่ม ไม่ต้องกดค้าง) ----------
   ปัดซ้าย = ลบ (มี ↩ เลิกทำ) · ปัดขวา = บันทึกด้วยหมวดแนะนำ (เฉพาะร้านที่มีแนะนำ) */
function bindSwipeAll(){
  document.querySelectorAll('#pane1 .swrow').forEach(function(rowEl){
    bindSwipeRow(rowEl, rowEl.getAttribute('data-ref'), rowEl.getAttribute('data-sug') || '');
  });
}
function closeOtherReveals(except){
  document.querySelectorAll('#pane1 .swrow').forEach(function(r){
    if (r !== except && (r.classList.contains('revL') || r.classList.contains('revR'))){
      r.classList.remove('revL', 'revR');
      setX(r, 0, true);
    }
  });
}
function setX(rowEl, x, animated){
  var item = rowEl.querySelector('.item');
  if (!item) return;
  if (animated){
    item.style.transition = 'transform .32s ' + SW.EASE;
    if (x === 0){
      // เด้งกลับแล้วเคลียร์ transform ทิ้ง — กัน iOS ทำ layer การ์ดแล้วแถวโหว่ตอนเลื่อนเร็ว
      item.style.transform = 'translate3d(0,0,0)';
      if (item._clearT) clearTimeout(item._clearT);
      item._clearT = setTimeout(function(){ item.style.transition = ''; item.style.transform = ''; item._clearT = null; }, 380);
    } else {
      item.style.transform = 'translate3d(' + x + 'px,0,0)';
    }
  } else {
    item.style.transition = 'none';
    item.style.transform = 'translate3d(' + x + 'px,0,0)';
  }
}
function itemX(rowEl){
  var item = rowEl.querySelector('.item');
  var t = item ? item.style.transform : '';
  var m = /translate3d\((-?[\d.]+)px/.exec(t);
  return m ? parseFloat(m[1]) : 0;
}
function bindSwipeRow(rowEl, ref, sug){
  var st = { active:false, dir:null, x0:0, y0:0, base:0, x:0, raw:0, vx:0, lastRaw:0, lastT:0, held:false };
  rowEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  rowEl.addEventListener('pointerdown', function(e){
    if (e.target.closest('.swact,.catgrid,.rowacts,.renbox,.billbox,button,input,a')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    st.x0 = e.clientX; st.y0 = e.clientY;
    st.base = itemX(rowEl);
    st.x = st.base;
    st.dir = null; st.active = true;
    if (!st.held){ st.held = true; uiSwipeOn(); }
    st.vx = 0; st.lastRaw = 0; st.lastT = 0;
    try { rowEl.setPointerCapture(e.pointerId); } catch (_e) {}
  });
  rowEl.addEventListener('pointermove', function(e){
    if (!st.active) return;
    var dx = e.clientX - st.x0, dy = e.clientY - st.y0;
    if (!st.dir){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { st.active = false; return; } // ตั้งใจเลื่อนหน้า
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.4) return; // ทแยง/ไม่ชัด — รอต่อ ไม่แย่งจอ
      if (dx > 0 && !sug) { st.active = false; return; }             // ปัดขวาใช้ได้เฉพาะร้านมีคำแนะนำ
      st.dir = 'h';
      var item = rowEl.querySelector('.item');
      if (item) item.style.transition = 'none';
      if (st.x === 0) closeOtherReveals(rowEl);
    }
    st.raw = st.base + dx;
    var x = damp(st.raw);
    st.x = x;
    var tNow = Date.now(); // วัดความเร็วนิ้ว (velocity) ไว้แยก "ปัดเร็ว/flick" กับ "ลากช้า"
    if (st.lastT && tNow > st.lastT) st.vx = (st.raw - st.lastRaw) / (tNow - st.lastT);
    st.lastRaw = st.raw; st.lastT = tNow;
    var item2 = rowEl.querySelector('.item');
    if (item2) item2.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0)';
    e.preventDefault();
  });
  function damp(v){
    var s = v < 0 ? -1 : 1, a = Math.abs(v);
    if (a <= SW.OPEN) return v;
    var out = SW.OPEN + (Math.min(a, SW.MAX) - SW.OPEN) * 0.32;
    if (a > SW.MAX) out += (a - SW.MAX) * 0.05;
    return s * out;
  }
  function finish(){
    if (!st.active) return;
    st.active = false;
    if (st.held){ st.held = false; uiSwipeOff(); }
    if (st.dir !== 'h') return;
    var x = st.x;
    if (Date.now() - st.lastT > 150) st.vx = 0; // นิ้วหยุดก่อนปล่อย = ไม่นับเป็นปัดเร็ว (flick)
    if (st.raw <= -SW.COMMIT){
      // ปัดแรงซ้าย → ลบเลย (มี ↩ เลิกทำ)
      setX(rowEl, -SW.MAX - 40, true);
      var item = rowEl.querySelector('.item');
      if (item){ item.style.transition = 'transform .18s ease-out, opacity .18s ease-out'; item.style.opacity = '0'; }
      rowEl._swiped = true; setTimeout(function(){ rowEl._swiped = false; }, 800);
      setTimeout(function(){ doSkip(ref, null); }, 200);
      return;
    }
    if (st.raw >= SW.COMMIT){
      // ปัดแรงขวา → บันทึกด้วยหมวดแนะนำเลย
      rowEl._swiped = true; setTimeout(function(){ rowEl._swiped = false; }, 800);
      setX(rowEl, 0, true);
      doSave(ref);
      return;
    }
    // ปัดเร็ว (flick) = ดู "ความเร็วนิ้ว" ด้วย ไม่ใช่แค่ระยะ — ปุ่มค้างเปิด ไม่เผยแล้วหุบ (snap back)
    var fastL = (st.vx <= -0.45 && st.raw <= -24);
    var fastR = (st.vx >= 0.45 && st.raw >= 24);
    if (fastL || x <= -SW.OPEN * 0.5){
      rowEl.classList.add('revL'); rowEl.classList.remove('revR');
      setX(rowEl, -SW.OPEN, true);
    } else if (fastR || x >= SW.OPEN * 0.5){
      rowEl.classList.add('revR'); rowEl.classList.remove('revL');
      setX(rowEl, SW.OPEN, true);
    } else {
      rowEl.classList.remove('revL', 'revR');
      setX(rowEl, 0, true);
    }
    rowEl._swiped = true; setTimeout(function(){ rowEl._swiped = false; }, 800);
  }
  rowEl.addEventListener('pointerup', finish);
  rowEl.addEventListener('pointercancel', function(){
    if (st.active){ st.active = false; }
    if (st.held){ st.held = false; uiSwipeOff(); }
    setX(rowEl, itemX(rowEl) <= -SW.OPEN * 0.5 ? -SW.OPEN : (itemX(rowEl) >= SW.OPEN * 0.5 ? SW.OPEN : 0), true);
  });
}

/* ---------- แก้โดย Hermes 4 ต.ค. 69 (P เคาะ · เธรด 🛒fullauto): ธีม มืด Charcoal / สว่าง Daylight + ปุ่มสลับ ---------- */
function applyTheme(t){
  var de = document.documentElement;
  if (de && de.setAttribute) de.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#f6f7f9' : '#141419');
}
function storedTheme(){
  try { var v = localStorage.getItem('nkf_theme'); return (v === 'light' || v === 'dark') ? v : ''; } catch(e){ return ''; }
}
function toggleTheme(){
  var cur = (document.documentElement && document.documentElement.getAttribute('data-theme')) === 'light' ? 'light' : 'dark';
  var next = cur === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('nkf_theme', next); } catch(e){}
  applyTheme(next);
}
el('btnTheme').addEventListener('click', toggleTheme);
(function(){
  var sd = storedTheme();
  applyTheme(sd || ((window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'));
  if (!sd && window.matchMedia){
    try {
      matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e){
        if (!storedTheme()) applyTheme(e.matches ? 'light' : 'dark');
      });
    } catch(e){}
  }
})();

  var p1 = el('recoverPass').value, p2 = el('recoverPass2').value;
  if (!p1 || p1.length < 6) { recoverErr('รหัสผ่านต้องมีอย่างน้อย 6 ตัว'); return; }
  if (p1 !== p2) { recoverErr('รหัสสองช่องไม่ตรงกัน — พิมพ์ให้ตรงกันอีกครั้ง'); return; }
  var btn = el('recoverBtn');

  RECOVER.done = true; // กัน event USER_UPDATED ที่จะวิ่งมาก่อน promise resolve
  recoverErr('');
  window.NKF_AUTH.updatePassword(p1, function(err){
    btn.disabled = false; btn.textContent = 'บันทึกรหัสผ่านใหม่';
    if (err) { RECOVER.done = false; recoverErr(err); return; }
    hideRecover();
    toast('ตั้งรหัสผ่านใหม่แล้ว — เข้าแอปได้เลย 🎉');
    bootAfterAuth();
  });

function findItem(ref){
  var d = S.data; if (!d) return null;
  for (var i=0;i<d.pending.length;i++) if (d.pending[i].ref === ref) return d.pending[i];
  for (var j=0;j<d.history.length;j++) if (d.history[j].ref === ref) return d.history[j];
  return null;
}
function pick(ref, cat){
  var it = findItem(ref); if (!it) return;
  if (it.status === 'saved'){ pickSaved(ref, cat); return; } // แก้โดย Hermes 4 ต.ค. 69: แถวบันทึกแล้ว → แก้หมวด (ไม่ปลุกกลับคิว)
  var m = catMeta(cat);
  it.status = 'saved'; it.category = cat;
  S.open[ref] = false; S.ext[ref] = false; if (S.renaming === ref) S.renaming = null;
  toast('✓ บันทึก ' + shortName(it) + ' → ' + m.e + ' ' + m.t, false, '↩ เลิกทำ', function(){
    it.status = 'new'; it.category = '';
    S.data.history = S.data.history.filter(function(x){ return x.ref !== ref; });
    if (!S.data.pending.some(function(x){ return x.ref === ref; })) S.data.pending.push(it);
    S.pMonth = (it.at || '').slice(0, 7); // แก้โดย Hermes 5 ต.ค. 69: เลือกเดือนของแถวที่กู้คืน ให้เห็นทันทีในแท็บรอยืนยัน
    recalcSummary(); paint();
    toast('กู้คืนแล้ว');
    if (!IS_DEMO) google.script.run.withSuccessHandler(function(){ reloadSoon(); }).undoSkip(ref);
  });
  recalcSummary(); paint();
  if (IS_DEMO) return;
  google.script.run
    .withSuccessHandler(function(res){
      if (!res || !res.ok) { toast('บันทึกไม่สำเร็จ' + (res && res.msg ? ' — ' + res.msg : ''), true); reloadSoon(); return; }
      reloadSoon();
    })
    .withFailureHandler(function(){ toast('บันทึกไม่สำเร็จ — เชื่อมต่อไม่ได้', true); reloadSoon(); })
    .saveCategory(ref, cat);
}
/* แก้โดย Hermes 4 ต.ค. 69 (P สั่ง · ม็อกเฟรม 5): แก้หมวดของแถวที่บันทึกแล้ว (จากแท็บประวัติ) —
   อัปเดต DB + ความจำร้านผ่าน saveCategory ชุดเดิม (แก้แล้วระบบจำค่านั้นให้) · มี ↩ เลิกทำ = เซฟหมวดเดิมกลับ */
function pickSaved(ref, cat){
  var it = findItem(ref); if (!it) return;
  var oldCat = it.category || '';
  S.open[ref] = false; S.ext[ref] = false; if (S.renaming === ref) S.renaming = null;
  if (oldCat === cat){ paint(); return; }
  var m = catMeta(cat);
  it.category = cat;
  toast('✓ เปลี่ยนหมวด: ' + shortName(it) + ' → ' + m.e + ' ' + m.t, false, '↩ เลิกทำ', function(){
    it.category = oldCat; paint();
    if (!IS_DEMO) google.script.run.withSuccessHandler(function(){ reloadSoon(); }).saveCategory(ref, oldCat);
  });
  paint();
  if (IS_DEMO) return;
  google.script.run
    .withSuccessHandler(function(res){
      if (!res || !res.ok) { toast('แก้หมวดไม่สำเร็จ' + (res && res.msg ? ' — ' + res.msg : ''), true); reloadSoon(); return; }
      reloadSoon();
    })
    .withFailureHandler(function(){ toast('แก้หมวดไม่สำเร็จ — เชื่อมต่อไม่ได้', true); reloadSoon(); })
    .saveCategory(ref, cat);
}

function doSkip(ref, animateEl){

    recalcSummary(); paint();

      it.status = 'new';
      if (!S.data.pending.some(function(x){ return x.ref === ref; })) S.data.pending.push(it);
      recalcSummary(); paint();
      if (!IS_DEMO) google.script.run.withSuccessHandler(function(){ reloadSoon(); }).undoSkip(ref);

        .withSuccessHandler(function(){ reloadSoon(); })

        .skipItem(ref);

    animateEl.style.transition = 'transform .18s ease-out, opacity .18s ease-out';
    animateEl.style.transform = 'translate3d(-150px,0,0)';
    animateEl.style.opacity = '0';
    setTimeout(commit, 190);

function recalcSummary(){
  var d = S.data, still = [], moved = 0;
  for (var j=0;j<d.pending.length;j++){
    var it = d.pending[j];
    if (it.status === 'saved') { d.history.unshift(it); moved++; }
    else if (it.status !== 'skipped') still.push(it);
  }
  d.pending = still;
  d.summary.pendingCount = still.length;
  d.summary.pendingSum = still.reduce(function(a,x){ return a + (x.direction==='in'?0:x.amount_minor); }, 0);
  d.meta.savedCount += moved;
  updateBadge();
}

function ringItemsFromCats(cats){

    if (c.cat === 'other') m = { slug: 'other', e: '✨', t: 'อื่นๆ' };

function ringHtml(items, cTop, cSub){
  var total = 0;
  for (var i = 0; i < items.length; i++) total += items[i].n;
  if (!total || !items.length) return '<div class="hint" style="margin:8px 6px">— ยังไม่มีข้อมูลเดือนนี้ —</div>';
  var SMALL_PCT = 3;   // หมวดเล็กกว่านี้ = slice ยังแยกแสดงครบ แต่ไม่ติดชิป (เลข/อีโมจิ)
  items = items.slice().sort(function(x, y){ return y.n - x.n; });
  var grads = [], spots = [], acc = 0, RC = 74;
  for (var j = 0; j < items.length; j++){
    var it2 = items[j];
    var pct = it2.n / total * 100;
    var col = RING_PAL[j % RING_PAL.length];
    var a0 = acc, a1 = acc + pct;
    grads.push(col + ' ' + a0.toFixed(2) + '% ' + a1.toFixed(2) + '%');
    spots.push({ e: it2.e, t: it2.t, n: it2.n, col: col, mid: (a0 + a1) / 2 });
    acc = a1;
  }
  var used = [], chipHtml = '', chipN = 0;
  for (var k = 0; k < spots.length; k++){
    var s2 = spots[k];
    if (s2.n / total * 100 < SMALL_PCT) continue;   // เล็ก — โชว์เป็นสีล้วน ไม่ติดชิป
    var rad = s2.mid * Math.PI / 50;
    var x = RC * Math.sin(rad);
    var y = -RC * Math.cos(rad) + [-8, 6, -10, 9][chipN % 4];   // ตัวเลขนอนเหมือนเดิม — เยื้องแกน Y คนละระยะ ไม่เรียบตรงทื่อ
    var amountText = '฿' + fmtShort(s2.n);          // ใส่หน่วยบาทบนชิป
    var chipW = Math.min(112, 36 + amountText.length * 7);
    var clash = false;
    for (var q = 0; q < used.length; q++){
      var dx = Math.abs(x - used[q][0]), dy = Math.abs(y - used[q][1]);
      if (dx < (chipW + used[q][2]) / 2 + 4 && dy < 28){ clash = true; break; }
    }
    if (!clash){
      used.push([x, y, chipW]);
      chipHtml += '<span class="rchip" style="left:calc(50% + ' + x.toFixed(1) + 'px);top:calc(50% + ' + y.toFixed(1) + 'px)">' + s2.e + '<span>' + amountText + '</span></span>';
      chipN++;
    }
  }
  return '<div class="ringw"><div class="rring" style="background:conic-gradient(' + grads.join(',') + ')"></div>'
    + '<div class="rctr"><span>' + cTop + '</span><strong>' + cSub + '</strong></div>'
    + chipHtml + '</div>';
}

function viewAcctHtml(d, a){

  var metas = { kplus: { name: 'K PLUS', img: 'kplus', sub: 'บัญชีหลัก · KBank' }, truemoney: { name: 'TrueMoney', img: 'truemoney', sub: 'กระเป๋า' } };
  var meta = metas[a] || { name: a, img: '', sub: '' };
  // แก้โดย Hermes 5 ต.ค. 69 (P สั่ง · เธรด "ปุ่มเปิด-ปิดรายการย่อยใน TrueMoney"): โหมดสรุปกระเป๋า — สวิตช์ติดตามรายการย่อย + ตัดรายการยิบย่อยออกจากหน้านี้
  var isTm = (a === 'truemoney');
  var tmOn = tmTrackOn();
  var off = isTm && !tmOn;
  // แก้โดย Hermes 7 ต.ค. 69: เขียว = heartbeat ท่อจริง (เหมือนการ์ดหน้าแรก) — เดิมอ่าน logTail ที่ว่างเสมอในโหมด Supabase
  var hbD = (d.meta && d.meta.health) || {};
  var ok = (a === 'kplus') && !!hbD.online;
  var arows = rowsOfAcct(a);
  var offSub = ' · ยังไม่เชื่อม — เลือกวิธี: เมล (auto) หรือ นำเข้าเอง';
  var kSub = hbD.lastAt ? ' · สแกนล่าสุด ' + fmtWhen(hbD.lastAt) : offSub;
  var tmSub = arows.length ? ' · นำเข้าเอง · ล่าสุด ' + fmtWhen(arows[0].at) : offSub;
  var conn = '<div class="conncard' + ((off || ok) ? '' : ' warm') + '">'
    + (LOGO_URL(meta.img) ? '<img src="' + LOGO_URL(meta.img) + '" alt="">' : '')
    + '<div><div class="c1">' + meta.name + '</div><div class="c2">' + meta.sub + (off ? ' · โหมดสรุป — ไม่ติดตามรายการย่อย'
        : (ok ? ' · เชื่อมผ่านอีเมล' : (isTm ? tmSub : kSub))) + '</div></div>'
    + '<span class="cc">' + (off ? '<span class="con2"><span class="sdot"></span>โหมดสรุป</span>'
        : (ok ? '<span class="con"><span class="sdot"></span>AUTO CONNECTED</span>'
        : (isTm ? (arows.length ? '<span class="con2"><span class="sdot"></span>นำเข้าเอง</span>' : '<span class="con2"><span class="sdot"></span>รอเชื่อม</span>')
                : '<span class="con2"><span class="sdot"></span>รอสแกนรอบถัดไป</span>'))) + '</span></div>';
  var swHtml = isTm
    ? '<div class="trkcard"><div class="ic">👛</div><div class="mid"><div class="nm">ติดตามรายการย่อยของกระเป๋า</div>'
      + '<div class="sub">' + (tmOn
          ? 'เปิดอยู่ — รายการของกระเป๋า (รูดการ์ด · settle · อื่น ๆ) เข้าคิวและคิดงบตามปกติ'
          : 'ปิดอยู่ — โหมดสรุป: ไม่มีรายการยิบย่อยเข้าคิว/ประวัติ/งบ · ข้อมูลเดิมไม่หาย เปิดกลับได้ตลอด') + '</div></div>'
      + '<button class="tmsw' + (tmOn ? ' on' : '') + '" data-act="tmTrack" aria-label="ติดตามรายการย่อยของกระเป๋า"><i></i></button></div>'
    : '';
  var items = ringItemsFromCats(acct.cats);
  if (acct.transfer_minor > 0) items.push({ e: '↪', t: 'ย้ายเข้ากระเป๋า', n: acct.transfer_minor });
  var billRem = 0;
  // แก้โดย CC 9 ต.ค. 69 (TASK_cc_bill_return_app ข้อ 4): อ่านฟิลด์ตาม shape ของ d.bills (remaining_minor) — เดิมอ่าน bill_expect ที่ไม่มี = 0 เสมอ
  //   นับเฉพาะบิล open ของบัญชีนี้ · เดือนนี้ · แถวบันทึกแล้ว (ชุดเดียวกับ dacct ที่หักสุทธิแล้ว)
  (d.bills || []).forEach(function(b){
    var bi = findItem(b.ref);
    if (b.status === 'open' && bi && bi.status === 'saved' && (bi.acct || 'kplus') === a && (b.at || '').slice(0, 7) === curMonthKey()) billRem += b.remaining_minor || 0;
  });
  if (billRem > 0) items.push({ e: '💸', t: 'รอเงินคืน', n: billRem });
  items.sort(function(x, y){ return y.n - x.n; });
  var totalOut = 0;
  items.forEach(function(x){ totalOut += x.n; });
  var head = '<div class="dt-top"><button class="dt-back" data-act="vclose"><svg><use href="#i-back"/></svg></button><div class="ttl">รายละเอียดบัญชี</div></div>';
  if (off){
    var hid = 0;
    try { hid = (d.meta && d.meta.tmHiddenCount) || 0; } catch (e3) {}
    return head + conn + swHtml
      + '<div class="sec-t">statement · ' + meta.name + '</div>'
      + '<div class="card" style="padding:12px 14px 12px">'
      + '<div class="trknote" style="margin:0 0 6px">โหมดสรุป — รายการย่อยของกระเป๋าถูกซ่อนจากคิว · ประวัติ · งบ' + (hid ? ' (ซ่อนอยู่ ' + hid + ' รายการ — ข้อมูลครบ ไม่หาย)' : ' (ข้อมูลไม่หาย)') + ' · นำเข้าเพิ่มได้เหมือนเดิม</div>'
      + '<button class="dt-imp" data-act="vimp">＋ นำเข้า statement เอง</button></div>';
  }
  var ring;
  if (a === 'truemoney' && !items.length){
    var pendT = arows.filter(function(x2){ return x2.status === 'new'; }).length;
    ring = '<div class="card"><div class="hint" style="margin:6px 2px">'
      + (pendT ? 'รอรีวิว ' + pendT + ' รายการ — กดหมวดแล้ววงจะขึ้น' : 'ยังไม่มี statement ของกระเป๋า — เลือกวิธีเชื่อมด้านบน')
      + '</div></div>';
  } else {
    ring = '<div class="card" style="padding:8px 6px 4px">' + ringHtml(items, 'ออกจากบัญชี', '−฿' + fmtBaht(totalOut)) + '</div>';
  }
  return head
    + conn + swHtml
    + '<div class="sec-t">ออกจากบัญชีนี้ไปไหน <span style="color:var(--dim);font-weight:400;font-size:10px">เดือนนี้</span></div>' + ring
    + '<div class="sec-t">statement · ' + meta.name + '</div><div class="card srows" style="padding:5px 14px 12px">'
    + detailRows(arows, 4)
    + (arows.length > 4 ? '<button class="dt-viewall" data-act="vall">ดูทั้งหมด ' + arows.length + ' รายการ →</button>' : '')
    + '<button class="dt-imp" data-act="vimp">＋ นำเข้า statement เอง</button></div>';
}

/* ---------- v2: ปฏิทินรายจ่ายประจำ ---------- */
function htmlCalendar(d){
  var fixed = d.fixed || [];
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var startIdx = new Date(y, m, 1).getDay();
  var daysIn = new Date(y, m + 1, 0).getDate();
  var today = now.getDate();
  var byDay = {};
  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): รายสัปดาห์ลงจุดทุกวันของเดือนที่ตรง dow (weeklyDotDays — logic เดียวกับ bridge)
  //   สีตามสถานะเฉพาะวันของ "งวดนี้" (f.due) · วันอื่นของเดือน = สี "รอ" (ยังไม่ติดตามสถานะงวดอื่น — เฟส 2)
  var curYm = y + '-' + (m + 1 < 10 ? '0' : '') + (m + 1);
  fixed.forEach(function(f){
    if (f.freq === 'weekly'){
      var dueD = (f.due && f.due.slice(0, 7) === curYm) ? parseInt(f.due.slice(8, 10), 10) : 0;
      weeklyDotDays(f.dow, y, m + 1).forEach(function(wd){ (byDay[wd] = byDay[wd] || []).push(wd === dueD ? f : { status: 'wait' }); });
      return;
    }
    (byDay[f.day] = byDay[f.day] || []).push(f);
  });
  function colorOf(f){ return f.status === 'done' ? '#22c55e' : (f.status === 'pending' ? '#f5b943' : '#3f3f4b'); }
  var cells = '';
  TH_DOW_S.forEach(function(n){ cells += '<div class="ck">'+n+'</div>'; });
  for (var i = 0; i < startIdx; i++) cells += '<div class="cd b"></div>';
  for (var dd = 1; dd <= daysIn; dd++){
    var dots = (byDay[dd] || []).map(function(f){ return '<span class="dd" style="background:'+colorOf(f)+'"></span>'; }).join('');
    cells += '<div class="cd'+(dd === today ? ' today' : '')+'"><span style="font-size:10px;color:'+(dd === today ? 'var(--tx)' : 'var(--mut)')+'">'+dd+'</span>'+(dots ? '<div class="dots">'+dots+'</div>' : '')+'</div>';
  }
  var budgets = d.budgets || [];
  var bt = d.budgetTotals || { spent_minor: 0, cap_minor: 0 };
  var bkeys = {}; budgets.forEach(function(b){ bkeys[b.key] = 1; });
  // แก้โดย CC — TASK_v42_recurring.md (3 ต.ค. 69): ส่วน "ใช้จ่ายรายวัน" แยกจากรายการประจำ (ยอดถูกหักฝั่ง bridge แล้ว)
  // แก้โดย Hermes 4 ต.ค. 69 (P สั่ง · เธรด 🛒fullauto): งบรายหมวดสร้าง/แก้/ลบเองได้ —
  //   ฟอร์ม + ปุ่ม ＋ เพิ่มงบ อยู่การ์ดนี้ (โชว์แม้ยังไม่มีงบ) · แถวแตะกางปุ่ม ✎/🗑 (เฉพาะโหมด Supabase/เดโม่)
  var budAddBtn = ((S.budForm || !(IS_SUPA || IS_DEMO)) ? '' : '<button class="miniact cy2" data-act="budNew">＋ เพิ่มงบ</button>');
  var budHtml = '';
  if (budgets.length){
    var tpct = bt.cap_minor > 0 ? Math.round(bt.spent_minor / bt.cap_minor * 100) : 0;
    var tcol = tpct >= 100 ? 'bred' : (tpct >= 80 ? 'bamb' : 'bcy');
    budHtml = '<div class="sec-t">ใช้จ่ายรายวัน (ไม่รวมรายการประจำ)</div><div class="card">'
      + '<div class="budtot"><div class="l">ใช้ไป <b>฿'+fmtBaht(bt.spent_minor)+'</b> จาก ฿'+fmtBaht(bt.cap_minor)+'</div><div class="pc">'+tpct+'<small>%</small></div></div>'
      + '<div class="bar"><i class="'+tcol+'" style="width:'+Math.min(100, tpct)+'%"></i></div>'
      + '<div class="hint" style="margin:7px 1px 0">ตัวเลขไม่รวมยอดที่จับคู่กับรายการประจำด้านล่าง</div></div>';
  }
  budHtml += '<div class="sec-t">งบรายหมวด</div><div class="card" id="budCard" style="padding:8px 14px">'
    + '<div style="display:flex;justify-content:flex-end;margin:2px 0 6px">'+budAddBtn+'</div>'
    + htmlBudForm()
    + (budgets.length
        ? budgets.map(function(b){ return budgetRow(b, { tap: (IS_SUPA || IS_DEMO), open: !!S.budOpen[b.key] }); }).join('')
        : (S.budForm ? '' : '<div class="hint" style="margin:4px 2px">— ยังไม่มีงบ — กด ＋ เพิ่มงบ เพื่อตั้งงบรายหมวดแรก</div>'))
    // แก้โดย Hermes 7 ต.ค. 69 (P เคาะ "ใช้แบบนี้" · §16): ก้อน "รายจ่ายประจำ" ท้ายการ์ด — แตะกางดูรายตัว
    + recLumpRow(recOutLump(fixed, budgets), { tap: (IS_SUPA || IS_DEMO), open: !!S.recLumpOpen })
    + '</div>';
  var fxList = fixed.filter(function(f){ return !bkeys[f.key]; });
  // แก้โดย Hermes — 4 ต.ค. 69 (พี่เคาะ "แบบ B" เธรด 🛒fullauto): แยกรายรับ/รายจ่ายเป็นคนละการ์ด
  //   "รายจ่ายประจำ" = สรุป รวมออก + ปุ่ม/ฟอร์มเพิ่ม (คอนเทนเนอร์เดิม #recCard) · "รายรับประจำ" = สรุป รวมเข้า — โชว์เมื่อมีรายการรับ
  var outL = fxList.filter(function(f){ return f.dir !== 'in'; });
  var inL = fxList.filter(function(f){ return f.dir === 'in'; });
  var outSum = outL.reduce(function(a, f){ return a + (f.amount_minor || 0); }, 0);
  var inSum = inL.reduce(function(a, f){ return a + (f.amount_minor || 0); }, 0);
  var outDone = outL.filter(function(f){ return f.status === 'done'; }).length;
  var inDone = inL.filter(function(f){ return f.status === 'done'; }).length;
  var byDaySort = function(a, b){ return a.day - b.day; };
  var addBtn = ((S.recForm || !(IS_SUPA || IS_DEMO)) ? '' : '<button class="miniact cy2" data-act="recNew">＋ เพิ่มรายการประจำ</button>');  // แก้โดย CC — TASK_cc_fix_v42.md (3 ต.ค. 69): ซ่อนในโหมด GAS เก่า
  var sumOut = outL.length
    ? '<div class="budtot" style="margin:2px 0 6px;align-items:center"><div class="l">รวมออก <b>฿'+fmtBaht(outSum)+'</b> · จ่ายแล้ว '+outDone+'/'+outL.length+'</div>'+addBtn+'</div>'
    : '<div style="display:flex;justify-content:flex-end;margin:2px 0 6px">'+addBtn+'</div>';
  var outCard = '<div class="sec-t">รายจ่ายประจำ</div><div class="card" id="recCard" style="padding:8px 14px">' + sumOut  // แก้โดย Hermes 7 ต.ค. 69 (v4.2.8): ฟอร์มย้ายไปหน้าแยก — การ์ดลิสต์ไม่กางฟอร์มในหน้าเดิม
    + (outL.slice(0).sort(byDaySort).map(function(f){ return fixedRow(f); }).join('') || '<div class="hint" style="margin:4px 2px">— ยังไม่มี —</div>') + '</div>';
  var inCard = inL.length
    ? '<div class="sec-t">รายรับประจำ</div><div class="card" style="padding:8px 14px">'
      + '<div class="budtot" style="margin:2px 0 6px"><div class="l">รวมเข้า <b>฿'+fmtBaht(inSum)+'</b> · รับแล้ว '+inDone+'/'+inL.length+'</div></div>'
      + inL.slice(0).sort(byDaySort).map(function(f){ return fixedRow(f); }).join('') + '</div>'
    : '';
  return '<div class="sec-t">ปฏิทิน · '+TH_M[m]+' '+String(y + 543).slice(2)+'</div>'
    + '<div class="card" style="padding:10px 10px"><div class="cal">'+cells+'</div>'
    + '<div class="segl" style="margin-top:8px"><span><span class="dot" style="background:#22c55e"></span>จ่าย/รับแล้ว</span><span><span class="dot" style="background:#f5b943"></span>ยังไม่ยืนยัน</span><span><span class="dot" style="background:#3f3f4b"></span>รอ</span><span><span class="dot" style="background:var(--cy)"></span>วันนี้</span></div></div>'
    + budHtml
    + outCard + inCard
    + '<div class="hint">แตะรายการเพื่อยืนยัน/แก้ · ลบได้ในปุ่มที่กาง · จับคู่อัตโนมัติแล้วจะขึ้น ✅ เอง</div>';
}
/* ---------- แก้โดย CC — TASK_v42_recurring.md (3 ต.ค. 69): ฟอร์มเพิ่มรายการประจำ (client-first แบบ incform) ---------- */
function recFormDefault(){
  // แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): เพิ่ม state โหมดพิมพ์ (ฟิลด์เดิม name/amt/day/dir/cat/freq/month คงชื่อเดิม — recSave อ่านตัวเดิม)

  return { name:'', amt:'', day:'', dir:'out', cat:'', freq:'monthly', month: new Date().getMonth() + 1, dow: null,

function recSyncInputs(){  // เก็บค่าที่พิมพ์ไว้ก่อน paint ใหม่ (กดชิปแล้วข้อความไม่หาย)
  var f = S.recForm; if (!f) return;
  var n = el('recName'), a = el('recAmt'), d = el('recDay'), ty = el('recType');
  if (ty) f.type = ty.value;  // แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): ประโยคที่พิมพ์ต้องไม่หายตอน paint

/* ---------- แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): โหมดพิมพ์เร็ว — parser ในเครื่อง (deterministic · ฟรี · ไม่ใช้เน็ต) ---------- */
var REC_MONTH_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
// คำเพี้ยน/คำย่อที่ระบบ "เดาให้" (ต้องขึ้นกล่องเหลืองให้ตรวจเสมอ) — config ล้วน: เพิ่มคู่คำได้โดยไม่แก้ logic
// raw = คำที่ผู้ใช้พิมพ์ · fixed = คำที่แก้ให้ (ต้องเป็นคำที่ parser รู้จักตรงตัว) · alts = ตัวเลือกให้แตะเปลี่ยน (ตัวแรก = ที่เดา)
// (TASK weekly จะเพิ่มคำวัน เช่น { raw:['เสา'], fixed:'เสาร์', alts:[...] } ต่อท้ายตารางนี้)
// แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): ช่องเสริมของ config — field (ค่าเริ่ม 'month') · after (regex บริบทข้างหน้าที่ต้องมี
// แทนเงื่อนไขขอบคำด้านหน้า — คำวันมักติดกับ "ทุกวัน")
var REC_WK_AFTER = /(?:ทุก\s*วัน|ทุก\s*อาทิต(?:ย์)?|(?:ทุก|ราย)\s*สัปดาห์\s*(?:วัน)?|ทุก)\s*$/;  // แก้โดย Hermes — 3 ต.ค. 69 (เธรด quick app): + "ทุก" เดี่ยว ให้ "ทุกเสา" เดาเป็น เสาร์ ได้
// แก้โดย Hermes — 8 ต.ค. 69 (เธรด "คำที่นิยมใช้"): คำช่วงเดือนแบบนิยม (ต้น/กลาง/ปลาย/สิ้นเดือน) — ตามหลังคำนำได้ (ทุก/ของ/ออก/จ่าย/งวด) หรืออักขระที่ไม่ใช่ตัวอักษร
var REC_DAY_AFTER = /(?:^|ทุก|ของ|ออก|จ่าย|งวด|[^฀-๿a-zA-Z])$/;
// คำวันที่ parser รู้จักตรงตัว (ไม่ต้องเดา) → dow · คำย่อหัวปฏิทินรับได้ (ต้องไม่ติดตัวอักษรตามหลัง)
var REC_DOW_WORDS = [['อาทิตย์',0],['จันทร์',1],['อังคาร',2],['พุธ',3],['พฤหัสบดี',4],['พฤหัส',4],['ศุกร์',5],['เสาร์',6],

// แก้โดย Hermes — 8 ต.ค. 69 (P สั่ง "ส่วนของ และ … ทำต่อในงานนี้เลย"): 2 รายการในประโยคเดียว (คั่น " และ ")

// แก้โดย Hermes — 8 ต.ค. 69 (P สั่ง "แดงที่เหลือแบบไม่กระทบตัวอื่น"): ชุดเดือน/ชุดวันครบ → แยกเป็นรายการละค่า (ไม่แตะ DB — ใช้ addRecurring เดิมทีละรายการ)
function recMultiBase_(p, allowBlocks){  // สมบูรณ์: ชื่อ+ยอด+ความถี่ใช้ได้ · warn เหลือเฉพาะบล็อกที่อนุญาต (ห้ามมี warn อื่น)

// ===== แก้โดย Hermes — 8 ต.ค. 69 (P สั่ง "auto workflow"): จำแนก "ประโยคที่เข้ามา" เป็นกลุ่ม + รหัส เพื่อป้อนลูปพัฒนาแบบ auto =====

function recClassifyCodes_(t, p, mm){
  var codes = [], name = String((p && p.name) || ''), amt = String((p && p.amt) || '');

  if (/(?:หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)/.test(name) || /\d+\s*(?:พัน|หมื่น|แสน|ล้าน)/.test(name)) codes.push('numwords');
  if (/(?:เวลา\s*\d{1,2}[.:]\d{2}|\d{1,2}\.\d{2}\s*น)/.test(t) && (/(?:^|\s)น\.?$/.test(name) || /เวลา/.test(name) || /^\d{1,2}\.\d{2}$/.test(amt))) codes.push('timedot');

  if (/จาก\s*\d+/.test(name)) codes.push('from-total');
  if (/^\s*(?:ผ่าน|จาก|โอน(?![ก-๙]))\s/.test(name)) codes.push('verb-prefix');
  if (/[\(\)\[\]]/.test(name)) codes.push('brackets-leftover');
  if (/[\u2600-\u27BF]|[\uD83C][\uDF00-\uDFFF]|[\uD83D][\uDC00-\uDFFF]/.test(name)) codes.push('emoji-name');
  if (/(?:ทุก|ราย)\s*ๆ?\s*1\s*(?:เดือน|สัปดาห์|อาทิต(?:ย์)?|ปี)/.test(t) && hasFreqBlock) codes.push('unit-one');
  if (ws.some(function(w){ return /และ\/กับ/.test(String(w.msg || '')); })) codes.push('two-items-incomplete');

      : /เว้น/.test(m) ? 'skip-freq' : /ครั้ง/.test(m) ? 'times-per' : 'every-N';

    var mB = ws.filter(function(w){ return w.field === 'month' && w.block; });
    if (mB.length) codes.push(/รายปี/.test(String(mB[0].msg || '')) ? 'need-month' : 'multi-incomplete');
    if (ws.some(function(w){ return w.field === 'day' && w.block; })) codes.push('multi-incomplete');

function recClassify(text, recall){
  var t = String(text == null ? '' : text);

  var mm = null;  // แยกได้จริงหรือไม่ ( และ / ชุดเดือน / ชุดวัน )
  if (t.indexOf(' และ ') >= 0) mm = parseRecMulti(t, recall || []);
  if (!mm) mm = recMultiFromMonths_(p) || recMultiFromDays_(p);
  var codes = recClassifyCodes_(t, p, mm);
  if (mm) codes = codes.filter(function(c){ return c !== 'two-items-incomplete' && c !== 'multi-incomplete'; });  // แยกได้แล้ว = รหัสไม่ต้องเตือน
  if (codes.indexOf('unit-one') >= 0) codes = codes.filter(function(c){ return c.indexOf('unsup:') !== 0; });  // 'ทุก 1 เดือน' = งานแก้เล็ก ไม่ใช่คิวออกแบบ

}

/* ---------- ภาพบิล: ซูม/ครอปเต็มจอ (ในเครื่องเท่านั้น · ไม่อัปโหลด) ----------
   ภาพวางแบบ contain ใน stage แล้วขยาย zoom (1–4×) รอบกลางจอ + เลื่อน pan · กรอบครอปเก็บเป็นพิกัดภาพ 0..1 (l,t,r,b)

var BS_ZMAX = 4, BS_CMIN = 0.06, BS_EDGE = 28;   // BS_EDGE = โซนขอบ (px แกน x) ที่บีบ 2 นิ้วแล้วเป็น «ปรับกรอบซ้าย-ขวา»

}
function bsClampPan(stW, stH, natW, natH, zoom, panX, panY){  // เลื่อนได้เฉพาะส่วนที่ล้นจอ
  var g = bsVGeom(stW, stH, natW, natH, zoom, 0, 0);

function bsPinchPan(mid0, pan0, z0, mid, z, center){  // จุดใต้นิ้วคงที่ระหว่างหุบ–กาง

var BS_CROP_SIDES = { tl: 'lt', tr: 'rt', bl: 'lb', br: 'rb', l: 'l', r: 'r', t: 't', b: 'b' };   // มุม = แก้ 2 ด้าน · ขอบ = ด้านเดียว
function bsCropMove(c, mode, dx, dy){  // ลากกรอบ: dx/dy = สัดส่วนของภาพ · mode = move|tl|tr|bl|br|l|r|t|b → กรอบใหม่ (อยู่ในภาพ · ไม่เล็กกว่าขั้นต่ำ)

function bsPinchKind(pA, pB, g, c){  // บีบ 2 นิ้ว: นิ้วหนึ่งในโซนขอบซ้าย + อีกนิ้วในโซนขอบขวา (วัดแกน x · ใน/นอกกรอบ) = 'lr' · นอกนั้น = 'zoom'

function bsPinchLR(c0, xL0, xR0, xL, xR, gw){  // บีบจากขอบ: นิ้วซ้ายคุม l · นิ้วขวาคุม r (ตามนิ้ว 1:1) · ไม่แตะ t/b · ไขว้กัน = ชน BS_CMIN

  var r = Math.min(1, Math.max(l + BS_CMIN, c0.r + (xR - xR0) / gw));

function bsCropSrc(c, natW, natH){  // กรอบ (0..1) → พิกัด drawImage บนภาพต้นฉบับ (px เต็ม · อยู่ในภาพ)

function bsLock(id){

  if (sh.split_mode === 'equal' && sh.party_n != null){   // หารเท่าไม่มีชื่อ (0015) — สูตรเดียวกับ SQL/bridge

    var workerUrl = new URL('./assets/vendor/pdfjs/pdf.worker.min.mjs', location.href).href;
    if (!_impPdfLegacy){
      try { m.GlobalWorkerOptions.workerSrc = workerUrl; } catch (e) {}
      _impPdfLib = m; return m;
    }
    /* เบราว์เซอร์เก่า: บังคับ main-thread (fake worker) ที่มี polyfill แล้ว — ไม่พึ่ง worker ที่อาจขาด API */
    return import(workerUrl).then(function(w){
      if (w && w.WorkerMessageHandler) globalThis.pdfjsWorker = { WorkerMessageHandler: w.WorkerMessageHandler };
      _impPdfLib = m; return m;
    });
  }).catch(function(e){
    _impPdfLibP = null;
    throw new Error('โหลดตัวถอดรหัส PDF ไม่ได้ — ต้องเปิดผ่านเว็บ (ไม่ใช่เปิดไฟล์ตรง ๆ)');
  });
  return _impPdfLibP;
}
function impPdfStart(bytes, name){
  if (!S.imp) S.imp = { acct: 'kplus', text: '', rows: null, err: '' };
  S.imp.pdfName = name; S.imp.fileName = '';
  S.imp.pdfBytes = bytes; S.imp.rows = null; S.imp.text = ''; S.imp.err = '';
  S.imp.needPw = false; S.imp.busy = true;
  renderImp();
  var saved = '';
  try { saved = localStorage.getItem('nkf_pdf_pw') || ''; } catch (e) {}
  impPdfTry(saved);
}
function impPdfTry(pw){
  var imp = S.imp;
  if (!imp || !imp.pdfBytes) return;
  imp.busy = true; imp.err = ''; imp.needPw = false; renderImp();
  impPdfLib().then(function(lib){
    var copy = imp.pdfBytes.slice(0);   /* pdf.js ยึด buffer — ส่งสำเนาทุกครั้ง กัน retry พัง */
    return lib.getDocument({ data: new Uint8Array(copy), password: pw || undefined, isEvalSupported: false }).promise;
  }).then(function(doc){
    return impPdfExtract(doc).then(function(pages){ try { doc.destroy(); } catch (e) {} return pages; });
  }).then(function(pages){
    if (!S.imp) return;
    var rows = [], i;
    for (i = 0; i < pages.length; i++) rows = rows.concat(impParseText(pages[i]));   /* parse ต่อหน้า เหมือนฝั่งคอม */
    S.imp.busy = false;
    S.imp.text = pages.join('\n');
    if (!rows.length){ S.imp.rows = null; S.imp.err = 'อ่าน PDF ได้ แต่ไม่พบรายการ — ตรวจว่าเป็น statement ที่ถูกต้อง แล้วเลือกไฟล์ใหม่'; renderImp(); return; }
    S.imp.rows = rows; S.imp.err = '';
    if (S.imp.pwSave === true && pw){ try {   /* opt-in เท่านั้น: รหัส = เลขบัตร ปชช. */ localStorage.setItem('nkf_pdf_pw', pw); } catch (e) {} }
    renderImp();
  }).catch(function(e){
    if (!S.imp) return;
    S.imp.busy = false;
    var nm = (e && e.name) || '';
    if (nm === 'PasswordException'){
      S.imp.needPw = true;
      S.imp.pwVal = pw || '';
      if (e.code === 2){
        S.imp.err = 'รหัสไม่ถูกต้อง — ลองอีกครั้ง';
        try { localStorage.removeItem('nkf_pdf_pw'); } catch (e2) {}
      }
    } else {
      S.imp.err = 'เปิด PDF ไม่ได้: ' + ((e && e.message) || 'ไฟล์เสียหรือไม่ใช่ PDF');
    }
    renderImp();
  });
}
function impPdfExtract(doc){
  var pages = [], n = doc.numPages, p = 1;
  function step(){
    if (p > n) return Promise.resolve(pages);
    var cur = p;
    p++;
    return doc.getPage(cur).then(function(page){
      return page.getTextContent();
    }).then(function(tc){
      pages.push(impPdfItemsToText(tc.items));
      return step();
    });
  }
  return step();
}
function impPdfSubmitPw(){
  var inp = el('impPw'), chk = el('impPwSave');
  var pw = inp ? String(inp.value || '') : '';
  if (!S.imp){ S.imp = { acct: 'kplus', text: '', rows: null, err: '' }; }
  S.imp.pwVal = pw;
  S.imp.pwSave = chk ? !!chk.checked : false;
  if (!S.imp.pwSave){ try { localStorage.removeItem('nkf_pdf_pw'); } catch (e) {} }   /* ไม่ติ๊ก = ลบรหัสที่เคยจำ */
  if (!pw.trim()){ S.imp.err = 'ใส่รหัสไฟล์ก่อนครับ'; renderImp(); return; }
  impPdfTry(pw.trim());
}
/* ---------- /v4.1 ---------- */

/* ---------- pose ไว้ถ่ายภาพสถานะ (เดโม่เท่านั้น): ?pose=grid|left|right|bill|inc ---------- */
function applyPose(p){
  var refs = S.data.pending.map(function(x){ return x.ref; });
  S.tab = 1;
  if (p === 'grid' || p === 'bill'){ if (refs[1]) S.open[refs[1]] = true; paint(); el('main').scrollTop = 60; return; }
  if (p === 'inc'){ S.tab = 0; S.incForm = true; paint(); el('main').scrollTop = 110; return; }
  if (p === 'cal'){ S.tab = 2; paint(); el('main').scrollTop = 0; return; }
  if (p === 'fx'){
    S.tab = 2; S.fxOpen = {};
    var fxAr = (S.data && S.data.fixed) ? S.data.fixed : [];
    var fPick = fxAr.filter(function(x){ return x.status === 'pending'; })[0] || fxAr[0];
    if (fPick) S.fxOpen[fPick.key] = 1;
    paint(); el('main').scrollTop = 0; return;
  }
  if (p === 'vmonth'){
    var msV = (S.data && S.data.mdet) || [];
    S.view = { t: 'month', m: msV.length ? msV[0].m : '' };
    paint(); return;
  }
  if (p === 'vacct'){ S.view = { t: 'acct', a: 'kplus' }; paint(); return; }
  if (p === 'vtmn'){ S.view = { t: 'acct', a: 'truemoney' }; paint(); return; }
  if (p === 'vall'){ var msV2 = (S.data && S.data.mdet) || []; S.view = { t: 'all', scope: 'month', m: msV2.length ? msV2[0].m : '' }; paint(); return; }
  if (p === 'valla'){ S.view = { t: 'all', scope: 'acct', a: 'kplus' }; paint(); return; }
  if (p === 'imp'){
    S.view = { t: 'acct', a: 'truemoney' }; paint();
    S.imp = { acct: 'truemoney', text: IMP_SAMPLE, rows: null, err: '' };
    S.imp.rows = impParseText(S.imp.text);
    el('impov').classList.add('on');
    renderImp();
    return;
  }
  if (p === 'hist'){ S.tab = 3; paint(); el('main').scrollTop = 0; return; }
  if (p === 'set'){ S.tab = 4; paint(); el('main').scrollTop = 0; return; }
  paint();
  var rows = document.querySelectorAll('#pane1 .swrow');
  var r = rows[1]; if (!r) return;
  if (p === 'left'){ r.classList.add('revL'); setX(r, -SW.OPEN, false); }
  if (p === 'right'){ r.classList.add('revR'); setX(r, SW.OPEN, false); }
  if (p === 'open'){ S.open[refs[1]] = true; paint(); el('main').scrollTop = 40; }
}

/* ---------- boot ---------- */
// บล็อก pinch-zoom ทั้งแอป (iOS) — กันสเกลเพี้ยนจากการหุบ/กางนิ้ว
try {
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
} catch (e) {}
// ปุ่มที่เผยค้างไว้ (revL/revR) — ปิดอัตโนมัติเมื่อ "เริ่มเลื่อนจอ" หรือ "แตะที่อื่น"
// กันเห็นปุ่ม บันทึก/ลบ แวบผ่านตอนเลื่อนจอเร็ว ๆ
document.addEventListener('pointerdown', function(e){
  var row = (e.target && e.target.closest) ? e.target.closest('.swrow') : null;
  closeOtherReveals(row);
}, true);
var _lastScrollClose = 0;
el('main').addEventListener('scroll', function(){
  var now = Date.now();
  if (now - _lastScrollClose < 600) return; // throttle
  _lastScrollClose = now;
  closeOtherReveals(null); // ปิดทุกแถวที่ค้างเปิด
}, { passive: true });
(function(){
  var m = /[?&]tab=([0-4])/.exec(location.search);
  if (m) S.tab = parseInt(m[1], 10);
})();
/* v3.2: ไฟล์ .txt/.csv ของหน้าต่างนำเข้า statement */
(function(){
  var fi = el('impFileIn');
  if (fi) fi.addEventListener('change', function(){
    var f = fi.files && fi.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      if (!S.imp) S.imp = { acct: 'kplus', text: '', rows: null, err: '' };
      S.imp.fileName = f.name; S.imp.pdfName = '';
      S.imp.text = String(rd.result || '');
      S.imp.rows = null; S.imp.err = '';
      renderImp();
    };
    rd.readAsText(f, 'utf-8');
    fi.value = '';
  });
  var ov = el('impov');
  if (ov) ov.addEventListener('click', function(e){ if (e.target === ov){ ov.classList.remove('on'); S.imp = null; } });
})();
/* แก้โดย Hermes 7 ต.ค. 69 (v4.2.8 · P เคาะ "ลุย"): รูปไอคอนหมวดทำเอง — อ่านในเครื่อง → ย่อ/ครอป 96px → dataURL (ไม่ขึ้นเซิร์ฟเวอร์จนกว่าจะกดบันทึกหมวด) */
(function(){
  var ci = el('catImgIn');
  if (!ci) return;
  ci.addEventListener('change', function(){
    var file = ci.files && ci.files[0];
    ci.value = '';
    if (!file || !S.catForm) return;
    try {
      var rd = new FileReader();
      rd.onload = function(){
        var im = new Image();
        im.onload = function(){
          try {
            var SZ = 96;
            var cv = document.createElement('canvas'); cv.width = SZ; cv.height = SZ;
            var ctx2 = cv.getContext('2d');
            var s = Math.min(im.width, im.height);
            ctx2.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, SZ, SZ);
            var out = cv.toDataURL('image/jpeg', 0.85);
            if (out.length > 260000) { toast('รูปใหญ่เกินไป — ลองรูปเล็กลง', true); return; }
            if (S.catForm){ S.catForm.iconImage = out; S.catForm.mode = 'image'; paint(); }
          } catch (e2) { toast('ทำรูปไม่สำเร็จ — ลองรูปอื่น', true); }
        };
        im.onerror = function(){ toast('อ่านรูปไม่สำเร็จ — ลองรูปอื่น', true); };
        im.src = rd.result;
      };
      rd.readAsDataURL(file);
    } catch (e3) { toast('เลือกรูปไม่สำเร็จ', true); }
  });
})();
/* v4.1: ไฟล์ PDF statement — อ่านดิบ → ถอดรหัสในเครื่อง (pdf.js) → ส่งขึ้นเฉพาะ "แถว" */
(function(){
  var fp = el('impPdfIn');
  if (fp) fp.addEventListener('change', function(){
    var f = fp.files && fp.files[0];
    fp.value = '';
    if (!f) return;
    if (!S.imp) S.imp = { acct: 'kplus', text: '', rows: null, err: '' };
    S.imp.pdfName = f.name; S.imp.fileName = '';
    S.imp.busy = true; S.imp.err = ''; S.imp.rows = null; S.imp.needPw = false;
    renderImp();
    var rd = new FileReader();
    rd.onload = function(){ impPdfStart(rd.result, f.name); };
    rd.onerror = function(){ if (S.imp){ S.imp.busy = false; S.imp.err = 'อ่านไฟล์ไม่ได้'; renderImp(); } };
    rd.readAsArrayBuffer(f);
  });
})();
/* เช็คอัปเดตเองทุกครั้งที่เปิด: iOS จำ HTML ของแอปหน้าจอโฮมไว้ ถ้าเจอเวอร์ชันใหม่ → เปิด URL ?v= ใหม่ (แคชคีย์ใหม่) ให้เลย */
(function(){
  setTimeout(function(){
    try {
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
        if (!j || !j.v || j.v === APP_BUILD) return;
        var gk = 'nkf_upd_' + j.v;
        try { if (sessionStorage.getItem(gk)) return; sessionStorage.setItem(gk, '1'); } catch (e2) {}
        var nv = String(j.v).replace(/[^0-9.]/g, '');
        try { toast('มีเวอร์ชันใหม่ — กำลังอัปเดต…'); } catch (e4) {}
        setTimeout(function(){
          location.replace(location.pathname + (nv ? '?v=' + nv : '') + (location.hash || ''));
        }, 350);
      }).catch(function(){});
    } catch (e3) {}
  }, 900);
})();
var POSE = /[?&]pose=([a-z]+)/.exec(location.search);
function bootAfterAuth(){
  reload(false);
  if (POSE){
    var _pv = 0, _pi = setInterval(function(){
      _pv++;
      if ((typeof S !== 'undefined' && S.data && S.data.mdet) || _pv > 40){ clearInterval(_pi); try { applyPose(POSE[1]); } catch (e) {} }
    }, 250);
  }
}
if (IS_DEMO) {
  render(DEMO);
  if (POSE) setTimeout(function(){ applyPose(POSE[1]); }, 140);
} else if (IS_SUPA) {
  // แก้โดย CC 23 ก.ย. 69 (TASK_p4_pwa_supabase): มี session → เข้าแอปเลย · ไม่มี → โชว์หน้าล็อกอิน
  // แก้โดย Hermes 28 ก.ย. 69 (forgot-password): แยกโหมด PASSWORD_RECOVERY — ต้องตั้งรหัสใหม่ก่อนเข้าแอป
  window.NKF_AUTH.init(function(session, evt){
    if (evt === 'PASSWORD_RECOVERY' || (!RECOVER.done && session && window.NKF_AUTH.initHashRecovery)) { enterRecover(); return; }
    if (session) { hideLogin(); hideRecover(); bootAfterAuth(); }
    else {
      showLogin();
      if (window.NKF_AUTH.initHashError) loginErr('ลิงก์ตั้งรหัสผ่านไม่ถูกต้องหรือใช้ไปแล้ว — กด "ลืมรหัสผ่าน?" เพื่อขอใหม่');
    }
  });
} else {
  bootAfterAuth();
}
