<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="tcMeta" content="#141419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NongKept">
<script>
/* แก้โดย Hermes 4 ต.ค. 69 (P เคาะ): ธีม มืด/สว่าง — ตั้งก่อนวาดจอ กันจอวาบ + อัปเดตแถบสีเบราว์เซอร์ */
(function(){
  var t = '';
  try { t = localStorage.getItem('nkf_theme') || ''; } catch(e){}
  if (t !== 'light' && t !== 'dark')
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#f6f7f9' : '#141419');
})();
</script>
<title>NongKept · FullAuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{ /* โทนมืด = Charcoal · โทนสว่าง = Daylight (แก้โดย Hermes 4 ต.ค. 69 · P เคาะเธรด 🛒fullauto — เดิมดำสนิท #070707) */
    --bg:#141419;--card:#1e1e24;--card2:#28282f;--bd:#31313a;--bd2:#26262e;--bd3:#43434d;
    --inset:#101014;--track:#0c0c10;
    --topbg:rgba(20,20,25,.92);--tabbg:rgba(22,22,27,.96);--ovl:rgba(3,3,5,.62);
    --tx:#f2f2f6;--mut:#a9a9b4;--dim:#75757f;
    --cy:#65dcff;--cy2:#8fe8ff;--grn:#7ee2a8;--grn2:#22c55e;--grn3:#9ae2b5;--grn4:#effff5;
    --amb:#f5b943;--amb2:#f5b943;--red:#ff8f8f;--red2:#ffb4b4;
    --cy-bg:rgba(101,220,255,.07);--cy-bg2:rgba(101,220,255,.15);--cy-bg3:rgba(101,220,255,.3);
    --cy-bd:rgba(101,220,255,.42);--cy-bd2:rgba(101,220,255,.62);
    --amb-bg:rgba(245,185,67,.07);--amb-bg2:rgba(245,185,67,.15);--amb-bg3:rgba(245,185,67,.3);
    --amb-bd:rgba(245,185,67,.42);--amb-bd2:rgba(245,185,67,.6);
    --grn-bg:rgba(34,197,94,.06);--grn-bd:rgba(34,197,94,.4);--grn-bd2:rgba(34,197,94,.5);
    --red-bg:rgba(255,143,143,.07);--red-bd:rgba(255,143,143,.5);--red-bd2:rgba(255,143,143,.55);
    --toastbg:#123324;--toastbtn-bg:rgba(255,255,255,.14);--toastbtn-bd:rgba(255,255,255,.28);
    --errbg:#3a1d1d;--chipsd:0 1px 5px #000b;--dtg1:#23232a;--dtg2:#1a1a20;
    color-scheme:dark;
  }
  html[data-theme="light"]{
    --bg:#f6f7f9;--card:#ffffff;--card2:#e6eaef;--bd:#e2e6ec;--bd2:#e7eaef;--bd3:#c8d2dd;
    --inset:#f1f3f7;--track:#e9edf2;
    --topbg:rgba(246,247,249,.92);--tabbg:rgba(248,249,252,.96);--ovl:rgba(15,23,42,.35);
    --tx:#191a1f;--mut:#5d6470;--dim:#7d8490;
    --cy:#65dcff;--cy2:#0b7f9e;--grn:#157f47;--grn2:#16a34a;--grn3:#157f47;--grn4:#14532d;
    --amb:#f5b943;--amb2:#b45309;--red:#cc3d3d;--red2:#b91c1c;
    --cy-bg:rgba(11,127,158,.08);--cy-bg2:rgba(11,127,158,.13);--cy-bg3:rgba(11,127,158,.22);
    --cy-bd:rgba(11,127,158,.35);--cy-bd2:rgba(11,127,158,.55);
    --amb-bg:rgba(180,83,9,.08);--amb-bg2:rgba(180,83,9,.14);--amb-bg3:rgba(180,83,9,.22);
    --amb-bd:rgba(180,83,9,.38);--amb-bd2:rgba(180,83,9,.55);
    --grn-bg:rgba(21,127,71,.09);--grn-bd:rgba(21,127,71,.35);--grn-bd2:rgba(21,127,71,.5);
    --red-bg:rgba(204,61,61,.08);--red-bd:rgba(204,61,61,.45);--red-bd2:rgba(204,61,61,.5);
    --toastbg:#e6f6ec;--toastbtn-bg:rgba(20,83,45,.08);--toastbtn-bd:rgba(20,83,45,.25);
    --errbg:#fdecec;--chipsd:0 1px 5px rgba(15,23,42,.14);--dtg1:#ffffff;--dtg2:#f2f4f8;
    color-scheme:light;
  }
  html,body{height:100%;overscroll-behavior:none}
  html{background:var(--bg)} /* กันแถบขาวด้านบน/โอเวอร์สกรอลล์ — ดำเต็มขอบ */
  body{background:var(--bg);color:var(--tx);
    font-family:'SF Pro Display','SF Pro Text','Kanit','Tahoma','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.4;
    display:flex;flex-direction:column;
    position:fixed;inset:0;width:100%;overflow:hidden;
    touch-action:manipulation} /* ล็อกกรอบแอปกับจอ (กันเลื่อนแล้วโผล่แถบขาว) + กันดับเบิลแทปซูม */
  body::before{content:'';position:fixed;inset:0;background:var(--bg);z-index:-1} /* ประกันพื้นดำเต็มจอ */
  button,input,.cg,.item,.nv,.miniact,.btn-cy,.incbtns button,.renbox button{touch-action:manipulation}
  .wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;height:100%}
  /* ---------- top bar ---------- */
  .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;
    padding-top:calc(14px + env(safe-area-inset-top));background:var(--topbg);backdrop-filter:blur(8px)}
  .logo{font-size:16px;font-weight:700;letter-spacing:.2px}
  .logo .p{font-size:9.5px;font-weight:700;color:#062026;background:var(--cy);border-radius:99px;padding:2px 7px;margin-left:7px;vertical-align:2.5px;letter-spacing:.3px}
  .top .right{display:flex;align-items:center;gap:8px}
  .date{font-size:11px;color:var(--mut)}
  .iconbtn{width:34px;height:34px;border-radius:12px;background:var(--card);border:1px solid var(--bd2);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .iconbtn:active{background:var(--card2)}
  .iconbtn.spin svg{animation:sp 1s linear infinite}
  /* ปุ่มสลับธีม: ไอคอนโชว์ตามโหมด (พระอาทิตย์ = กดไปโหมดสว่าง · พระจันทร์ = กดไปโหมดมืด) */
  #btnTheme .i-moon{display:none}
  html[data-theme="light"] #btnTheme .i-sun{display:none}
  html[data-theme="light"] #btnTheme .i-moon{display:block}
  @keyframes sp{to{transform:rotate(360deg)}}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 24px;overscroll-behavior:contain}
  .tabpane{display:none}
  .tabpane.on{display:block}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px 15px;margin-bottom:9px}
  .hero .lbl{font-size:11.5px;color:var(--mut)}
  .hero .amt{font-size:30px;font-weight:650;letter-spacing:.2px;font-variant-numeric:tabular-nums;margin-top:2px}
  .hero .sub{font-size:11px;color:var(--dim);margin-top:3px}
  .hero .sub b{font-weight:600}
  .gr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .gr-head .t{font-size:11.5px;color:var(--mut);font-weight:600}
  .gr-head .r{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .gr{display:block;width:100%;height:auto}
  .xlab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);padding:3px 2px 0;font-variant-numeric:tabular-nums}
  .gr-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:7px;font-variant-numeric:tabular-nums}
  .gr-foot b{color:var(--tx);font-weight:600}
  .pend{display:flex;align-items:center;gap:11px;background:var(--amb-bg);border:1px solid var(--amb-bd);border-radius:18px;padding:12px 15px;margin-bottom:9px}
  .pend .e{font-size:17px}
  .pend .txt{flex:1;min-width:0}
  .pend .txt .t1{font-size:13px;font-weight:600}
  .pend .txt .t2{font-size:11px;color:var(--mut);margin-top:1px;font-variant-numeric:tabular-nums}
  .btn-cy{background:var(--cy);border:1px solid var(--cy);color:#062026;font-weight:700;border-radius:12px;padding:8px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .btn-cy:active{box-shadow:0 0 0 3px rgba(101,220,255,.16)}
  .sec-t{font-size:11.5px;color:var(--mut);font-weight:600;margin:12px 3px 8px}
  .list-hd{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
  .list-hd .l .t1{font-size:13.5px;font-weight:700}
  .list-hd .l .t2{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
  /* แก้โดย Hermes 4 ต.ค. 69 (P สั่ง · เธรด): ประวัติรายการ — หัวเดือนแยกส่วน (แต่ละเดือนเรียงของตัวเอง) */
  .mgroup-t{display:flex;justify-content:space-between;align-items:baseline;margin:6px 3px 8px;padding-top:10px;border-top:1px solid var(--bd2)}
  .mgroup-t .mt{font-size:12.5px;font-weight:700;letter-spacing:.2px}
  .mgroup-t .mn{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .list-hd + .mgroup-t{border-top:none;padding-top:2px;margin-top:0}
  /* แก้โดย Hermes 5 ต.ค. 69 (P สั่ง · เธรด "หน้ารอยืนยัน"): ชิปเลือกเดือน — แท็บรอยืนยันแยกเดือน ไม่ปนกัน */
  .pchips{display:flex;gap:7px;margin:2px 2px 10px;flex-wrap:wrap}
  .pchip{background:transparent;border:1px solid var(--bd2);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums}
  .pchip.on{background:var(--cy-bg2);border-color:var(--cy-bd2);color:var(--cy2)}
  .pchip:active{border-color:var(--bd3)}
  /* ---------- swipe row (iOS Clock style: ปัดได้เลย เด้งนุ่ม ไม่ต้องกดค้าง) ---------- */
  .swrow{position:relative;margin-bottom:8px;border-radius:16px;overflow:hidden;touch-action:pan-y;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .swact{position:absolute;top:0;bottom:0;width:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:none;font-family:inherit;cursor:pointer;font-size:11px;font-weight:600}
  .swact.del{right:0;background:var(--amb-bg2);color:var(--amb2);border-radius:0 16px 16px 0}
  .swact.del:active{background:var(--amb-bg3)}
  .swact.save{left:0;background:var(--cy-bg2);color:var(--cy2);border-radius:16px 0 0 16px}
  .swact.save:active{background:var(--cy-bg3)}
  .swact i{font-style:normal;font-size:15px}
  .swrow .item{position:relative;z-index:2;margin-bottom:0;background:var(--card)}
  /* ---------- items ---------- */
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
  .item:active{border-color:var(--bd3);background:var(--card2)}
  .item.open{align-items:flex-start;border-color:var(--bd3);background:var(--card2);flex-wrap:wrap}
  .icw{width:35px;height:35px;border-radius:12px;background:var(--inset);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .item.open .icw{margin-top:1px}
  .mid{flex:1;min-width:0}
  .mid .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .rt{text-align:right;flex:none}
  .amt{font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--red)}
  .amt.in{color:var(--grn)}
  .rt .cchip{font-size:9.5px;color:var(--mut);margin-top:3px}
  .rt .cchip.done{color:var(--grn3);font-weight:600}
  .rt .cchip.amber{color:var(--amb2);font-weight:600}
  .chev{color:var(--dim);font-size:17px;flex:none;padding-left:2px;line-height:1}
  .hint{font-size:11px;color:var(--dim);margin:3px 3px 13px;line-height:1.55}
  .hint b{color:var(--mut);font-weight:600}
  .empty{text-align:center;color:var(--dim);font-size:12.5px;padding:38px 10px;line-height:1.8}
  /* ---------- บล็อกกางเต็มความกว้าง (กริดอยู่กลางการ์ด) ---------- */
  .exp{flex-basis:100%;width:100%;margin-top:10px}
  .catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:340px;margin:0 auto}
  .cg{position:relative;background:var(--inset);border:1px solid var(--bd2);border-radius:13px;padding:8px 3px 7px;text-align:center;
    font-size:10px;color:var(--tx);cursor:pointer;transition:.13s;line-height:1.25;-webkit-tap-highlight-color:transparent}
  .cg:active{background:var(--card2);border-color:var(--bd3)}
  .cg i{display:block;font-size:16.5px;font-style:normal;margin-bottom:2.5px}
  .cg.more{color:var(--mut)}
  .cg.sug{border-color:var(--amb-bd2);background:var(--amb-bg2)}
  .cg.cur{border-color:var(--cy-bd2);background:var(--cy-bg)}  /* แก้โดย Hermes 4 ต.ค. 69: หมวดปัจจุบันของแถวที่บันทึกแล้ว */
  .cg .st{position:absolute;top:4px;right:6px;font-size:8.5px;color:var(--amb2);line-height:1}
  .cg .st.cur{color:var(--cy2)}
  .sgdot{font-size:9px;color:var(--amb2);margin-top:3px;font-weight:600}
  /* ---------- บิลรอเงินคืน ---------- */
  .billbox{margin-top:10px;padding:9px 11px;border:1px solid var(--bd2);border-radius:12px;background:var(--inset);font-size:11px}
  .billbox .bt{color:var(--mut);line-height:1.5}
  .billbox .bt b{color:var(--amb2);font-weight:700}
  .billbox.open{border-color:var(--amb-bd)}
  .billbox.done{border-color:var(--grn-bd);color:var(--grn3)}
  .billbox.flat{color:var(--dim)}
  .brow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 2px;border-top:1px solid var(--bd2);align-items:baseline}
  .gr-head + .brow{border-top:none}
  .brow .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .r{color:var(--amb2);flex:none;font-variant-numeric:tabular-nums;font-weight:600}
  .brow .ok{color:var(--grn3);font-weight:600}
  .incbtns{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
  .incbtns .save{background:var(--cy);border:1px solid var(--cy);color:#062026;font-weight:700;border-radius:11px;padding:8px 14px;font-size:12px;font-family:inherit;cursor:pointer}
  .incbtns .cancel{background:transparent;border:1px solid var(--bd);color:var(--mut);border-radius:11px;padding:8px 12px;font-size:12px;font-family:inherit;cursor:pointer}
  .incform{margin-top:9px}
  .incform input{width:100%;background:var(--inset);border:1px solid var(--bd2);border-radius:11px;color:var(--tx);
    font-size:16px;padding:8px 11px;font-family:inherit;outline:none;margin-bottom:7px;-webkit-user-select:text;user-select:text}
  .incform input:focus{border-color:var(--cy)}
  .incrow{display:flex;gap:7px}
  .incrow input{flex:1}
  .miniact.cy2{color:var(--cy2);border-color:var(--cy-bd)}
  .rowacts{display:flex;gap:7px;margin-top:10px;justify-content:center}
  .miniact{background:transparent;border:1px solid var(--bd2);color:var(--mut);border-radius:10px;padding:6px 11px;font-size:10.5px;font-family:inherit;cursor:pointer}
  .miniact:active{border-color:var(--bd3);color:var(--tx)}
  .renbox{display:flex;gap:7px;margin-top:2px}
  .renbox input{flex:1;min-width:0;background:var(--inset);border:1px solid var(--cy);border-radius:11px;color:var(--tx);
    font-size:16px;padding:8px 11px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text}
  /* ^ input ต้อง >=16px ไม่งั้น iOS Safari เด้งซูมเองเวลาโฟกัสช่องพิมพ์ */
  .renbox .save{background:var(--cy);border:1px solid var(--cy);color:#062026;font-weight:700;border-radius:11px;
    padding:8px 13px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .renbox .cancel{background:transparent;border:1px solid var(--bd);color:var(--mut);border-radius:11px;padding:8px 11px;font-size:12px;font-family:inherit;cursor:pointer}
  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:300;
    background:var(--toastbg);border:1px solid var(--grn-bd2);color:var(--grn3);border-radius:14px;padding:9px 14px;font-size:12px;
    max-width:88%;transition:transform .25s,opacity .25s;box-shadow:0 10px 30px rgba(0,0,0,.45);font-weight:500;
    opacity:0;pointer-events:none;display:flex;align-items:center}
  #toast.err{background:var(--errbg);border-color:var(--red-bd);color:var(--red2)}
  #toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  #toast button{margin-left:10px;flex:none;background:var(--toastbtn-bg);border:1px solid var(--toastbtn-bd);
    color:var(--grn4);border-radius:9px;padding:4px 10px;font-size:11.5px;font-family:inherit;cursor:pointer;font-weight:600}
  /* ---------- nav ---------- */
  .tabbar{display:flex;border-top:1px solid var(--bd2);background:var(--tabbg);backdrop-filter:blur(8px);
    padding:8px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--dim);cursor:pointer;position:relative;background:none;border:none;font-family:inherit}
  .nv .ic{width:24px;height:22px;display:flex;align-items:center;justify-content:center;position:relative}
  .nv .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nv.on{color:var(--cy2);font-weight:600}
  .nv .bdg{position:absolute;top:-5px;right:-9px;background:var(--amb);color:#241a04;font-size:9px;font-weight:700;border-radius:99px;padding:1px 5px;line-height:1.2}
  /* ---------- info rows ---------- */
  .irow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--bd2);font-size:12.5px}
  .irow:first-child{border-top:none}
  .irow .k{color:var(--mut)}
  .irow .v{font-variant-numeric:tabular-nums;text-align:right}
  .irow a{color:var(--cy2);text-decoration:none}
  .logline{font-size:10.5px;color:var(--mut);padding:5px 2px;border-top:1px solid var(--bd2);font-variant-numeric:tabular-nums;line-height:1.5}
  .logline:first-child{border-top:none}
  .load{padding:60px 0;text-align:center;color:var(--dim);font-size:12px}
  .spinner{width:26px;height:26px;border:2.5px solid var(--bd2);border-top-color:var(--cy);border-radius:50%;margin:0 auto 12px;animation:sp 0.9s linear infinite}
  /* ---------- v2: หลายบัญชี · เงินไปไหน (แบบ C) · ปฏิทิน · โลโก้ ---------- */
  .lgx{width:21px;height:21px;border-radius:6px;object-fit:contain}
  .amtxf{color:var(--mut)}
  .cchip.xf{color:var(--cy2)}
  .seg{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:10px;background:var(--track);border:1px solid var(--bd2)}
  .seg i{display:block;height:100%}

/* ============ v4.2.4: งบรายหมวดสร้างเองได้ (แก้โดย Hermes 4 ต.ค. 69 · P สั่งในเธรด 🛒fullauto — รอรับ forecast) ============

   เพิ่ม/แก้ = setBudget (upsert by key) · ลบ = deleteBudget · เดโม่แก้ในเครื่องอย่างเดียว */
function budCats(){  // หมวดที่ตั้งงบได้ — ตัดรายรับ/เติมเงิน (ไม่เข้าเงื่อนไขงบ — ตรงกับ computeBudgets ฝั่ง bridge)

function budSave(){
  var f = S.budForm; if (!f) return;
  budSyncInputs();
  var iss = budIssues(f);
  if (iss.length){ toast(iss[0], true); return; }
  var v = parseBahtMinor(f.amt);
  var cats = f.cats.slice(0);
  var label = String(f.label || '').replace(/\s+/g, ' ').trim().slice(0, 60);
  if (!label) label = 'งบ' + cats.map(function(c){ return catMeta(c).t; }).join('/');
  var emoji = f.emoji || (catMeta(cats[0]) || {}).e || '';
  var key = f.key || ('ub-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4)).replace(/[^a-z0-9\-_]/g, '');
  var daysIn = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
  var snap = JSON.parse(JSON.stringify(f));
  S.budForm = null;
  if (IS_DEMO){
    var list = S.data.budgets = S.data.budgets || [];
    var row = null;
    for (var i = 0; i < list.length; i++) if (list[i].key === key) row = list[i];
    if (!row){ row = { key: key, spent_minor: 0, day: 0, overlap: false }; list.push(row); }
    row.label = label; row.emoji = emoji; row.cats = cats;
    row.per_day = (f.mode === 'day') ? v : 0;
    row.cap_minor = (f.mode === 'day') ? v * daysIn : v;
    budRecalcRow(row);
    budRecalcTotals();
    paint();
    toast(f.key ? 'แก้ไขงบแล้ว ✓' : 'เพิ่มงบแล้ว ✓');
    return;
  }
  paint();
  callAction('setBudget', [key, { label: label, emoji: emoji, cats: cats.join(','),
    cap_per_day: (f.mode === 'day') ? v : 0, cap_minor: (f.mode === 'day') ? 0 : v }],
    f.key ? 'แก้ไขงบแล้ว ✓' : 'เพิ่มงบแล้ว ✓', function(){
      if (!S.budForm){ S.budForm = snap; S.tab = 2; paint(); }  // บันทึกไม่สำเร็จ — เปิดฟอร์มคืน (แบบ recSave)
    });

function budRecalcRow(row){
  row.remain_minor = Math.max(0, (row.cap_minor || 0) - (row.spent_minor || 0));
  row.over_minor = Math.max(0, (row.spent_minor || 0) - (row.cap_minor || 0));
  row.pct = row.cap_minor > 0 ? Math.round(row.spent_minor / row.cap_minor * 100) : 0;
}
function budRecalcTotals(){
  var t = { spent_minor: 0, cap_minor: 0 };
  ((S.data && S.data.budgets) || []).forEach(function(b){ t.spent_minor += (b.spent_minor || 0); t.cap_minor += (b.cap_minor || 0); });

function budDel(key){
  var list = (S.data && S.data.budgets) || [];
  var b = null;
  for (var i = 0; i < list.length; i++) if (list[i].key === key) b = list[i];
  if (!b) return;
  if (!confirm('ลบงบ "' + b.label + '" ?\nยอดที่ใช้ไปแล้วไม่หาย — แค่เลิกติดตามงบนี้')) return;
  S.data.budgets = list.filter(function(x){ return x.key !== key; });
  if (S.budForm && S.budForm.key === key) S.budForm = null;
  delete S.budOpen[key];
  budRecalcTotals();

function sumDaily(arr){ var t=0; for(var i=0;i<arr.length;i++) t+=arr[i].n; return t; }
function graphPeak(arr){

function xlabels(arr){

function buildGraph(daily){
  var vals = daily.map(function(x){ return x.n; });
  var W=370, H=112, PL=22, PT=12, PB=16, n=vals.length;
  if (n < 2) return '';
  var vmax = Math.max.apply(null, vals.concat([1])) * 1.18;
  var xs=[], ys=[];
  for (var i=0;i<n;i++){ xs.push(PL + i*(W-PL*2)/(n-1)); ys.push(PT + (1 - vals[i]/vmax)*(H-PT-PB)); }
  function cr(p0,p1,p2,p3){
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    return 'C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  var pts=[]; for (var k=0;k<n;k++) pts.push([xs[k],ys[k]]);
  var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+' ';
  for (var j=0;j<n-1;j++) d+=cr(pts[Math.max(0,j-1)], pts[j], pts[j+1], pts[Math.min(n-1,j+2)])+' ';
  var area = d + 'L'+pts[n-1][0].toFixed(1)+','+(H-3)+' L'+pts[0][0].toFixed(1)+','+(H-3)+' Z';
  var last = pts[n-1], gid = 'gg' + Math.random().toString(36).slice(2,7);
  return '<svg class="gr" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#65dcff" stop-opacity=".26"/><stop offset="1" stop-color="#65dcff" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="'+area+'" fill="url(#'+gid+')"/>'
    + '<path d="'+d+'" fill="none" stroke="#65dcff" stroke-width="2.4" stroke-linecap="round"/>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.6" style="fill:var(--bg)" stroke="#65dcff" stroke-width="2.2"/>'
    + '</svg>';
}

/* ---------- pending ---------- */
/* แก้โดย Hermes 5 ต.ค. 69 (P สั่ง · เธรด "หน้ารอยืนยัน"): แยกเดือน — กดชิปเลือกเดือนได้ (ไม่ปนกัน)
   · ในเดือนที่เลือก เรียง "เวลาล่าสุดขึ้นก่อน" · เดือนที่เลือกหายไป (เคลียร์ครบ) → ถอยมาเดือนล่าสุดอัตโนมัติ */
function pendingMonths(d){
  var groups = {}, order = [];
  for (var i = 0; i < d.pending.length; i++){
    var mk = (d.pending[i].at || '').slice(0, 7);
    if (!groups[mk]) { groups[mk] = []; order.push(mk); }
    groups[mk].push(d.pending[i]);
  }
  order.sort(function(a, b){ return a > b ? -1 : (a < b ? 1 : 0); }); // เดือนล่าสุดก่อน
  return { groups: groups, order: order };
}
function htmlPending(d){
  if (!d.pending.length) return '<div class="empty">🎉 เคลียร์ครบแล้ว<br>ไม่มีรายการรอยืนยัน — รออีเมลรอบใหม่</div>';
  var mm = pendingMonths(d);
  if (!mm.groups[S.pMonth]) S.pMonth = mm.order[0];   // ยังไม่เลือก/เดือนเดิมหาย → เดือนล่าสุด
  var items = mm.groups[S.pMonth].slice().sort(function(a, b){ return a.at > b.at ? -1 : (a.at < b.at ? 1 : 0); }); // ในเดือนนี้: ล่าสุดขึ้นก่อน
  var chips = '';
  if (mm.order.length > 1){
    chips = '<div class="pchips">';
    for (var ci = 0; ci < mm.order.length; ci++){
      var mk = mm.order[ci];
      chips += '<button class="pchip' + (mk === S.pMonth ? ' on' : '') + '" data-act="pmon" data-m="' + mk + '">' + monthLabelOf(mk) + ' · ' + mm.groups[mk].length + '</button>';
    }
    chips += '</div>';
  }
  var rows = items.map(function(it){ return pendingRow(d, it); }).join('');
  return '<div class="list-hd"><div class="l"><div class="t1">รอยืนยัน · '+d.summary.pendingCount+'</div><div class="t2">รวม ฿'+fmtBaht(d.summary.pendingSum)+'</div></div></div>'
    + chips
    + rows
    + '<div class="hint"><b>ปัดซ้าย = ลบ · ปัดขวา = บันทึก</b> (เฉพาะร้านที่มี ★ แนะนำ) · แตะ = กางหมวด / ตั้งบิลรอคืน / แก้ชื่อ</div>';
}
function pendingRow(d, it){

function billBlock(it){

function categoryGrid(d, it){
  var sug = it.suggested || '';
  // แก้โดย Hermes 4 ต.ค. 69 (P สั่ง): แถวที่บันทึกแล้ว — ติ๊ก ✓ ที่หมวดปัจจุบัน (แถวรอยืนยันยังใช้ ★ แนะนำ เหมือนเดิม)
  var saved = (it.status === 'saved');
  var cur = saved ? (it.category || '') : '';
  function cell(slug, e, t){
    var isCur = !!(cur && cur === slug);
    var isSug = (!saved && sug === slug);
    return '<div class="cg'+(isCur?' cur':(isSug?' sug':''))+'" data-act="pick" data-ref="'+esc(it.ref)+'" data-cat="'+slug+'">'
      + '<i>'+e+'</i>'+esc(t)+(isCur?'<span class="st cur">✓</span>':(isSug?'<span class="st">★ แนะนำ</span>':''))+'</div>';
  }
  var cells = d.main.map(function(slug){
    var m = catMeta(slug);
    return cell(m.slug, m.e, m.t);
  }).join('');
  var more = '<div class="cg more" data-act="more" data-ref="'+esc(it.ref)+'"><i>'+(S.ext[it.ref] ? '–' : '➕')+'</i>'+(S.ext[it.ref] ? 'ย่อ' : 'อื่นๆ')+'</div>';
  if (S.ext[it.ref]){
    var rest = d.cats.filter(function(c){ return d.main.indexOf(c[0]) === -1; }).map(function(c){
      return cell(c[0], c[1], c[2]);
    }).join('');
    return '<div class="catgrid">' + rest + more + '</div>';
  }
  return '<div class="catgrid">' + cells + more + '</div>';
}

/* แก้โดย Hermes 4 ต.ค. 69 (P สั่ง · เธรด "ประวัติรายการ"): 3 อย่าง —
   ① แถวบันทึกแล้วแตะแก้ได้ (หมวด/ชื่อ) ② แยกเดือน (เดิมรวมทุกเดือนเป็นลิสต์เดียว) ③ ในแต่ละเดือนเรียง "เวลาล่าสุดขึ้นก่อน"
   — แต่ละเดือนเรียงของตัวเอง ไม่รวมเป็นก้อนเดียว · เดือนล่าสุดขึ้นก่อน */
function htmlHistory(d){
  if (!d.history.length) return '<div class="empty">ยังไม่มีรายการที่บันทึก — ปัดขวาหรือกดหมวดได้เลย</div>';
  var groups = {}, order = [];
  for (var i = 0; i < d.history.length; i++){
    var mk = (d.history[i].at || '').slice(0, 7);
    if (!groups[mk]) { groups[mk] = []; order.push(mk); }
    groups[mk].push(d.history[i]);
  }
  order.sort(function(a, b){ return a > b ? -1 : (a < b ? 1 : 0); }); // เดือนล่าสุดก่อน
  var hid = 0;
  var out = '<div class="list-hd"><div class="l"><div class="t1">ประวัติรายการ</div>'

/* ---------- swipe (iOS Clock style: ตามนิ้วทันที เด้งนุ่ม ไม่ต้องกดค้าง) ----------
   ปัดซ้าย = ลบ (มี ↩ เลิกทำ) · ปัดขวา = บันทึกด้วยหมวดแนะนำ (เฉพาะร้านที่มีแนะนำ) */
function bindSwipeAll(){
  document.querySelectorAll('#pane1 .swrow').forEach(function(rowEl){
    bindSwipeRow(rowEl, rowEl.getAttribute('data-ref'), rowEl.getAttribute('data-sug') || '');
  });
}
function closeOtherReveals(except){
  document.querySelectorAll('#pane1 .swrow').forEach(function(r){
    if (r !== except && (r.classList.contains('revL') || r.classList.contains('revR'))){
      r.classList.remove('revL', 'revR');
      setX(r, 0, true);
    }
  });
}
function setX(rowEl, x, animated){
  var item = rowEl.querySelector('.item');
  if (!item) return;
  if (animated){
    item.style.transition = 'transform .32s ' + SW.EASE;
    if (x === 0){
      // เด้งกลับแล้วเคลียร์ transform ทิ้ง — กัน iOS ทำ layer การ์ดแล้วแถวโหว่ตอนเลื่อนเร็ว
      item.style.transform = 'translate3d(0,0,0)';
      if (item._clearT) clearTimeout(item._clearT);
      item._clearT = setTimeout(function(){ item.style.transition = ''; item.style.transform = ''; item._clearT = null; }, 380);
    } else {
      item.style.transform = 'translate3d(' + x + 'px,0,0)';
    }
  } else {
    item.style.transition = 'none';
    item.style.transform = 'translate3d(' + x + 'px,0,0)';
  }
}
function itemX(rowEl){
  var item = rowEl.querySelector('.item');
  var t = item ? item.style.transform : '';
  var m = /translate3d\((-?[\d.]+)px/.exec(t);
  return m ? parseFloat(m[1]) : 0;
}
function bindSwipeRow(rowEl, ref, sug){
  var st = { active:false, dir:null, x0:0, y0:0, base:0, x:0, raw:0, vx:0, lastRaw:0, lastT:0, held:false };
  rowEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  rowEl.addEventListener('pointerdown', function(e){
    if (e.target.closest('.swact,.catgrid,.rowacts,.renbox,.billbox,button,input,a')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    st.x0 = e.clientX; st.y0 = e.clientY;
    st.base = itemX(rowEl);
    st.x = st.base;
    st.dir = null; st.active = true;
    if (!st.held){ st.held = true; uiSwipeOn(); }
    st.vx = 0; st.lastRaw = 0; st.lastT = 0;
    try { rowEl.setPointerCapture(e.pointerId); } catch (_e) {}
  });
  rowEl.addEventListener('pointermove', function(e){
    if (!st.active) return;
    var dx = e.clientX - st.x0, dy = e.clientY - st.y0;
    if (!st.dir){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { st.active = false; return; } // ตั้งใจเลื่อนหน้า
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.4) return; // ทแยง/ไม่ชัด — รอต่อ ไม่แย่งจอ
      if (dx > 0 && !sug) { st.active = false; return; }             // ปัดขวาใช้ได้เฉพาะร้านมีคำแนะนำ
      st.dir = 'h';
      var item = rowEl.querySelector('.item');
      if (item) item.style.transition = 'none';
      if (st.x === 0) closeOtherReveals(rowEl);
    }
    st.raw = st.base + dx;
    var x = damp(st.raw);
    st.x = x;
    var tNow = Date.now(); // วัดความเร็วนิ้ว (velocity) ไว้แยก "ปัดเร็ว/flick" กับ "ลากช้า"
    if (st.lastT && tNow > st.lastT) st.vx = (st.raw - st.lastRaw) / (tNow - st.lastT);
    st.lastRaw = st.raw; st.lastT = tNow;
    var item2 = rowEl.querySelector('.item');
    if (item2) item2.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0)';
    e.preventDefault();
  });
  function damp(v){
    var s = v < 0 ? -1 : 1, a = Math.abs(v);
    if (a <= SW.OPEN) return v;
    var out = SW.OPEN + (Math.min(a, SW.MAX) - SW.OPEN) * 0.32;
    if (a > SW.MAX) out += (a - SW.MAX) * 0.05;
    return s * out;
  }
  function finish(){
    if (!st.active) return;
    st.active = false;
    if (st.held){ st.held = false; uiSwipeOff(); }
    if (st.dir !== 'h') return;
    var x = st.x;
    if (Date.now() - st.lastT > 150) st.vx = 0; // นิ้วหยุดก่อนปล่อย = ไม่นับเป็นปัดเร็ว (flick)
    if (st.raw <= -SW.COMMIT){
      // ปัดแรงซ้าย → ลบเลย (มี ↩ เลิกทำ)
      setX(rowEl, -SW.MAX - 40, true);
      var item = rowEl.querySelector('.item');
      if (item){ item.style.transition = 'transform .18s ease-out, opacity .18s ease-out'; item.style.opacity = '0'; }
      rowEl._swiped = true; setTimeout(function(){ rowEl._swiped = false; }, 800);
      setTimeout(function(){ doSkip(ref, null); }, 200);
      return;
    }
    if (st.raw >= SW.COMMIT){
      // ปัดแรงขวา → บันทึกด้วยหมวดแนะนำเลย
      rowEl._swiped = true; setTimeout(function(){ rowEl._swiped = false; }, 800);
      setX(rowEl, 0, true);
      doSave(ref);
      return;
    }
    // ปัดเร็ว (flick) = ดู "ความเร็วนิ้ว" ด้วย ไม่ใช่แค่ระยะ — ปุ่มค้างเปิด ไม่เผยแล้วหุบ (snap back)
    var fastL = (st.vx <= -0.45 && st.raw <= -24);
    var fastR = (st.vx >= 0.45 && st.raw >= 24);
    if (fastL || x <= -SW.OPEN * 0.5){
      rowEl.classList.add('revL'); rowEl.classList.remove('revR');
      setX(rowEl, -SW.OPEN, true);
    } else if (fastR || x >= SW.OPEN * 0.5){
      rowEl.classList.add('revR'); rowEl.classList.remove('revL');
      setX(rowEl, SW.OPEN, true);
    } else {
      rowEl.classList.remove('revL', 'revR');
      setX(rowEl, 0, true);
    }
    rowEl._swiped = true; setTimeout(function(){ rowEl._swiped = false; }, 800);
  }
  rowEl.addEventListener('pointerup', finish);
  rowEl.addEventListener('pointercancel', function(){
    if (st.active){ st.active = false; }
    if (st.held){ st.held = false; uiSwipeOff(); }
    setX(rowEl, itemX(rowEl) <= -SW.OPEN * 0.5 ? -SW.OPEN : (itemX(rowEl) >= SW.OPEN * 0.5 ? SW.OPEN : 0), true);
  });
}

function animPop(sel){

    if (n && n.animate) {

        [{ opacity:0.2, transform:'translateY(-6px)' }, { opacity:1, transform:'translateY(0)' }],

    }
  } catch (e) {}
}

/* ---------- แก้โดย Hermes 4 ต.ค. 69 (P เคาะ · เธรด 🛒fullauto): ธีม มืด Charcoal / สว่าง Daylight + ปุ่มสลับ ---------- */
function applyTheme(t){
  var de = document.documentElement;
  if (de && de.setAttribute) de.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#f6f7f9' : '#141419');
}
function storedTheme(){
  try { var v = localStorage.getItem('nkf_theme'); return (v === 'light' || v === 'dark') ? v : ''; } catch(e){ return ''; }
}
function toggleTheme(){
  var cur = (document.documentElement && document.documentElement.getAttribute('data-theme')) === 'light' ? 'light' : 'dark';
  var next = cur === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('nkf_theme', next); } catch(e){}
  applyTheme(next);
}
el('btnTheme').addEventListener('click', toggleTheme);
(function(){
  var sd = storedTheme();
  applyTheme(sd || ((window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'));
  if (!sd && window.matchMedia){
    try {
      matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e){
        if (!storedTheme()) applyTheme(e.matches ? 'light' : 'dark');
      });
    } catch(e){}
  }
})();

function findItem(ref){
  var d = S.data; if (!d) return null;
  for (var i=0;i<d.pending.length;i++) if (d.pending[i].ref === ref) return d.pending[i];
  for (var j=0;j<d.history.length;j++) if (d.history[j].ref === ref) return d.history[j];
  return null;
}
function pick(ref, cat){
  var it = findItem(ref); if (!it) return;
  if (it.status === 'saved'){ pickSaved(ref, cat); return; } // แก้โดย Hermes 4 ต.ค. 69: แถวบันทึกแล้ว → แก้หมวด (ไม่ปลุกกลับคิว)
  var m = catMeta(cat);
  it.status = 'saved'; it.category = cat;
  S.open[ref] = false; S.ext[ref] = false; if (S.renaming === ref) S.renaming = null;
  toast('✓ บันทึก ' + shortName(it) + ' → ' + m.e + ' ' + m.t, false, '↩ เลิกทำ', function(){
    it.status = 'new'; it.category = '';
    S.data.history = S.data.history.filter(function(x){ return x.ref !== ref; });
    if (!S.data.pending.some(function(x){ return x.ref === ref; })) S.data.pending.push(it);
    S.pMonth = (it.at || '').slice(0, 7); // แก้โดย Hermes 5 ต.ค. 69: เลือกเดือนของแถวที่กู้คืน ให้เห็นทันทีในแท็บรอยืนยัน

    .withSuccessHandler(function(res){

    .saveCategory(ref, cat);
}
/* แก้โดย Hermes 4 ต.ค. 69 (P สั่ง · ม็อกเฟรม 5): แก้หมวดของแถวที่บันทึกแล้ว (จากแท็บประวัติ) —
   อัปเดต DB + ความจำร้านผ่าน saveCategory ชุดเดิม (แก้แล้วระบบจำค่านั้นให้) · มี ↩ เลิกทำ = เซฟหมวดเดิมกลับ */

    it.category = oldCat; paint();

  });
  paint();
  if (IS_DEMO) return;

function doSkip(ref, animateEl){

    animateEl.style.transform = 'translate3d(-150px,0,0)';
    animateEl.style.opacity = '0';

function recalcSummary(){
  var d = S.data, still = [], moved = 0;
  for (var j=0;j<d.pending.length;j++){
    var it = d.pending[j];
    if (it.status === 'saved') { d.history.unshift(it); moved++; }
    else if (it.status !== 'skipped') still.push(it);
  }
  d.pending = still;
  d.summary.pendingCount = still.length;
  d.summary.pendingSum = still.reduce(function(a,x){ return a + (x.direction==='in'?0:x.amount_minor); }, 0);
  d.meta.savedCount += moved;
  updateBadge();
}

    var col = RING_PAL[j % RING_PAL.length];
    var a0 = acc, a1 = acc + pct;
    grads.push(col + ' ' + a0.toFixed(2) + '% ' + a1.toFixed(2) + '%');
    spots.push({ e: it2.e, t: it2.t, n: it2.n, col: col, mid: (a0 + a1) / 2 });
    acc = a1;
  }
  var used = [], chipHtml = '', chipN = 0;
  for (var k = 0; k < spots.length; k++){
    var s2 = spots[k];
    if (s2.n / total * 100 < SMALL_PCT) continue;   // เล็ก — โชว์เป็นสีล้วน ไม่ติดชิป
    var rad = s2.mid * Math.PI / 50;
    var x = RC * Math.sin(rad);
    var y = -RC * Math.cos(rad) + [-8, 6, -10, 9][chipN % 4];   // ตัวเลขนอนเหมือนเดิม — เยื้องแกน Y คนละระยะ ไม่เรียบตรงทื่อ
    var amountText = '฿' + fmtShort(s2.n);          // ใส่หน่วยบาทบนชิป
    var chipW = Math.min(112, 36 + amountText.length * 7);
    var clash = false;
    for (var q = 0; q < used.length; q++){
      var dx = Math.abs(x - used[q][0]), dy = Math.abs(y - used[q][1]);
      if (dx < (chipW + used[q][2]) / 2 + 4 && dy < 28){ clash = true; break; }
    }
    if (!clash){
      used.push([x, y, chipW]);
      chipHtml += '<span class="rchip" style="left:calc(50% + ' + x.toFixed(1) + 'px);top:calc(50% + ' + y.toFixed(1) + 'px)">' + s2.e + '<span>' + amountText + '</span></span>';
      chipN++;
    }
  }
  return '<div class="ringw"><div class="rring" style="background:conic-gradient(' + grads.join(',') + ')"></div>'
    + '<div class="rctr"><span>' + cTop + '</span><strong>' + cSub + '</strong></div>'
    + chipHtml + '</div>';
}

function htmlCalendar(d){
  var fixed = d.fixed || [];
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var startIdx = new Date(y, m, 1).getDay();
  var daysIn = new Date(y, m + 1, 0).getDate();
  var today = now.getDate();
  var byDay = {};
  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): รายสัปดาห์ลงจุดทุกวันของเดือนที่ตรง dow (weeklyDotDays — logic เดียวกับ bridge)
  //   สีตามสถานะเฉพาะวันของ "งวดนี้" (f.due) · วันอื่นของเดือน = สี "รอ" (ยังไม่ติดตามสถานะงวดอื่น — เฟส 2)
  var curYm = y + '-' + (m + 1 < 10 ? '0' : '') + (m + 1);
  fixed.forEach(function(f){
    if (f.freq === 'weekly'){
      var dueD = (f.due && f.due.slice(0, 7) === curYm) ? parseInt(f.due.slice(8, 10), 10) : 0;
      weeklyDotDays(f.dow, y, m + 1).forEach(function(wd){ (byDay[wd] = byDay[wd] || []).push(wd === dueD ? f : { status: 'wait' }); });
      return;
    }
    (byDay[f.day] = byDay[f.day] || []).push(f);
  });
  function colorOf(f){ return f.status === 'done' ? '#22c55e' : (f.status === 'pending' ? '#f5b943' : '#3f3f4b'); }
  var cells = '';
  TH_DOW_S.forEach(function(n){ cells += '<div class="ck">'+n+'</div>'; });
  for (var i = 0; i < startIdx; i++) cells += '<div class="cd b"></div>';
  for (var dd = 1; dd <= daysIn; dd++){
    var dots = (byDay[dd] || []).map(function(f){ return '<span class="dd" style="background:'+colorOf(f)+'"></span>'; }).join('');
    cells += '<div class="cd'+(dd === today ? ' today' : '')+'"><span style="font-size:10px;color:'+(dd === today ? 'var(--tx)' : 'var(--mut)')+'">'+dd+'</span>'+(dots ? '<div class="dots">'+dots+'</div>' : '')+'</div>';
  }

  //   ฟอร์ม + ปุ่ม ＋ เพิ่มงบ อยู่การ์ดนี้ (โชว์แม้ยังไม่มีงบ) · แถวแตะกางปุ่ม ✎/🗑 (เฉพาะโหมด Supabase/เดโม่)

      + '<div class="budtot"><div class="l">ใช้ไป <b>฿'+fmtBaht(bt.spent_minor)+'</b> จาก ฿'+fmtBaht(bt.cap_minor)+'</div><div class="pc">'+tpct+'<small>%</small></div></div>'

  var sumOut = outL.length
    ? '<div class="budtot" style="margin:2px 0 6px;align-items:center"><div class="l">รวมออก <b>฿'+fmtBaht(outSum)+'</b> · จ่ายแล้ว '+outDone+'/'+outL.length+'</div>'+addBtn+'</div>'
    : '<div style="display:flex;justify-content:flex-end;margin:2px 0 6px">'+addBtn+'</div>';
  var outCard = '<div class="sec-t">รายจ่ายประจำ</div><div class="card" id="recCard" style="padding:8px 14px">' + sumOut + htmlRecForm()

  var inCard = inL.length

      + '<div class="budtot" style="margin:2px 0 6px"><div class="l">รวมเข้า <b>฿'+fmtBaht(inSum)+'</b> · รับแล้ว '+inDone+'/'+inL.length+'</div></div>'
      + inL.slice(0).sort(byDaySort).map(function(f){ return fixedRow(f); }).join('') + '</div>'
    : '';
  return '<div class="sec-t">ปฏิทิน · '+TH_M[m]+' '+String(y + 543).slice(2)+'</div>'
    + '<div class="card" style="padding:10px 10px"><div class="cal">'+cells+'</div>'
    + '<div class="segl" style="margin-top:8px"><span><span class="dot" style="background:#22c55e"></span>จ่าย/รับแล้ว</span><span><span class="dot" style="background:#f5b943"></span>ยังไม่ยืนยัน</span><span><span class="dot" style="background:#3f3f4b"></span>รอ</span><span><span class="dot" style="background:var(--cy)"></span>วันนี้</span></div></div>'
    + budHtml
    + outCard + inCard
    + '<div class="hint">แตะรายการเพื่อยืนยัน/แก้ · ลบได้ในปุ่มที่กาง · จับคู่อัตโนมัติแล้วจะขึ้น ✅ เอง</div>';
}

  var FILL = /(ได้รับ|รับ|ได้|เงินเข้า|จ่าย|ชำระ|หัก|เพิ่ม|บันทึก|รายการ|บาท)/, mf;
  while ((mf = recFind_(w, FILL, function(c){ return !c || /\s/.test(c); }, function(c){ return !c || /\s/.test(c); }))) w = recBlank_(w, mf.i, mf.j);
  w = w.replace(/^\s*(จ่าย|เพิ่ม|บันทึก)(?=[ก-๙a-zA-Z])/, ' ');

  // 8) ชื่อ = ที่เหลือ
  var name = w.replace(/[·•,:;|]+/g, ' ').replace(/\s+/g, ' ').replace(/^[\s\-–]+|[\s\-–]+$/g, '').trim();
  out.name = name.slice(0, 60).trim();
  out.brand = brandKey(out.name);

  // 9) เตือนช่องที่ยังไม่ครบ/ไม่ถูก — ระบบไม่เดาให้
  var W = [];
  if (!out.name) W.push({ field: 'name', msg: 'ใส่ชื่อรายการด้วย' });
  if (!out.amt) W.push({ field: 'amt', msg: 'ใส่ยอดด้วย' });
  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): รายสัปดาห์ไม่ใช้วันที่ 1–31 → เตือน "เลือกวัน" แทน (บล็อกจนกว่าจะเลือก)
  if (out.freq === 'weekly'){
    if (out.dow == null) W.push({ field: 'dow', msg: 'เลือกวัน (จ–อา)', block: true });
  }
  else if (out.day == null) W.push({ field: 'day', msg: 'ใส่วันที่จ่าย (เช่น วันที่ 5)' });
  else if (!(out.day >= 1 && out.day <= 31)) W.push({ field: 'day', msg: 'วันที่ ' + out.day + ' ไม่มีจริง — ต้องเป็น 1–31' });
  if (unsup) W.push({ field: 'freq', msg: '"' + unsup + '" (รายวัน) ยังไม่รองรับ — แตะเลือก ทุกสัปดาห์/ทุกเดือน/ทุกปี', block: true });
  if (out.freq === 'yearly' && !out.month && !out.warn.length) W.push({ field: 'month', msg: 'รายปี — ระบุเดือนด้วย (เช่น 25 ต.ค.)', block: true });
  out.warn = W.concat(out.warn);

  // 10) เดาหมวด: ชื่อตรงรายการของฉัน → หมวดนั้น · แบรนด์เดียวกัน → หมวดนั้น · คำใน CAT_WORDS · ไม่เจอ = ว่าง
  var nq = recNorm(out.name), cg = '';

      if (!rc[ri] || !rc[ri].cat) continue;
      if (recNorm(rc[ri].name) === nq){ cg = rc[ri].cat; break; }
      if (!byBrand && out.brand && (rc[ri].brand || brandKey(rc[ri].name)) === out.brand) byBrand = rc[ri].cat;
    }
    if (!cg) cg = byBrand;
    if (!cg){
      var low = out.name.toLowerCase();
      for (var wi = 0; wi < CAT_WORDS.length && !cg; wi++){
        for (var wj = 0; wj < CAT_WORDS[wi].words.length; wj++){
          if (low.indexOf(CAT_WORDS[wi].words[wj]) >= 0){ cg = CAT_WORDS[wi].cat; break; }
        }
      }
    }
  }
  if (cg === 'income' && out.dir !== 'in') cg = '';
  out.catGuess = cg;
  return out;
}

// เติมผล parse ลงฟอร์ม (ทับทั้งชุด) — หมวดที่ผู้ใช้แตะเองแล้ว (catTouched) ห้ามทับ

  if (p.dow != null) f.dow = p.dow;

// เหตุที่ยังบันทึกไม่ได้ (ว่าง = ครบ) — ใช้ทั้ง recSave (toast) และสถานะปุ่ม "เพิ่มรายการ" (ชุดเดียว)

  var weekly = f.freq === 'weekly';

  if (!String(f.name || '').replace(/\s+/g, ' ').trim()) out.push('ใส่ชื่อรายการด้วย');
  if (!(parseBahtMinor(f.amt) > 0)) out.push('ใส่ยอดด้วย');
  var dayStr = String(f.day == null ? '' : f.day).trim();

  (f.warn || []).forEach(function(w){ if (w.block && w.field !== 'freq' && w.field !== 'dow') out.push(w.msg); });
  // แก้โดย CC — TASK_cc_fix_v42.md (3 ต.ค. 69): รายปี → วันต้องมีจริงในเดือนที่เลือก (เช็คกับปีปัจจุบัน · ก.พ. 29 ตามปีอธิกสุรทิน)

function recWarnPiece(field){ return field === 'day' || field === 'month' || field === 'dow' ? 'freq' : field; }  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): + dow

  var nq = recNorm(f.name); if (!nq) return null;
  var rc = recRecall();

function recSentence(it){  // ข้อมูลรายการ → ประโยค (แล้ว parse ทางเดียวกับพิมพ์จริง)

/* ---------- live typing: พิมพ์แล้วเติมสด (debounce) — วาดใหม่เฉพาะโซน ไม่ paint เต็ม (focus/caret ไม่หลุด) ---------- */
var REC_DEBOUNCE_MS = 250;
function recPushInputs(f, force){  // ค่าในฟอร์ม → ช่อง input (ข้ามช่องที่กำลังพิมพ์ เว้นแต่ force)
  var map = [['recType', f.type], ['recName', f.name], ['recAmt', f.amt], ['recDay', f.day]];
  for (var i = 0; i < map.length; i++){
    var n = el(map[i][0]);
    if (n && (force || n !== document.activeElement)) n.value = map[i][1] == null ? '' : map[i][1];
  }
}
function recRefresh(){
  var f = S.recForm; if (!f) return;
  var z = [['recZA', recHtmlA], ['recZB', recHtmlB], ['recZF', recHtmlFreqChips], ['recZD', recHtmlDirChips], ['recZK', recHtmlCatChips]];
  for (var i = 0; i < z.length; i++){ var n = el(z[i][0]); if (n) n.innerHTML = z[i][1](f); }
  var dw = el('recDayW'); if (dw) dw.style.display = f.freq === 'weekly' ? 'none' : '';  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): พิมพ์จนเป็น weekly → ซ่อนช่องวันที่สด
  recPushInputs(f, false);
}
function recRepaint(){ var f = S.recForm; if (f) recPushInputs(f, true); paint(); }  // ค่าเปลี่ยนจากโค้ด → ดันลงช่องก่อน (paint จะอ่านช่องกลับ)
function recLiveApply(){
  if (S._recT){ clearTimeout(S._recT); S._recT = null; }
  S._recPending = false;
  var f = S.recForm; if (!f) return;
  recSyncInputs();
  recApply(f);
  recRefresh();
}
function recLiveTick(){  // นิ้วเพิ่งแตะจอ (กำลังกดชิป) → เลื่อนไปก่อน กันโซนถูกวาดใหม่ระหว่าง pointerdown→click (คลิกหาย) · การกดจะ flush เอง
  if (Date.now() - (UI.lastTouch || 0) < 350){ S._recT = setTimeout(recLiveTick, 200); return; }
  recLiveApply();
}
function recFlush(){ if (S._recPending) recLiveApply(); }  // มีข้อความค้าง debounce → parse ให้เสร็จก่อนทำอย่างอื่น
function recFlushCancel(){ if (S._recT) clearTimeout(S._recT); S._recT = null; S._recPending = false; }
function recTyping(){
  var a = document.activeElement;
  return !!(S.recForm && a && /^rec(Type|Name|Amt|Day)$/.test(a.id || ''));
}
document.addEventListener('input', function(e){
  var t = e.target, f = S.recForm;
  if (!t || !f) return;
  if (t.id === 'recType'){
    f.type = t.value;
    S._recPending = true;
    if (S._recT) clearTimeout(S._recT);
    S._recT = setTimeout(recLiveTick, REC_DEBOUNCE_MS);
    return;
  }
  var fld = t.id === 'recName' ? 'name' : (t.id === 'recAmt' ? 'amt' : (t.id === 'recDay' ? 'day' : ''));
  if (fld){ recFlush(); recSyncInputs(); recDropWarn(f, fld); recRefresh(); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target && e.target.id === 'recType'){ e.preventDefault(); recSave(); }
});
function recEdit(v, forceOpen){
  var f = S.recForm; if (!f) return;
  recFlush(); recSyncInputs();
  f.edit = (f.edit === v && !forceOpen) ? '' : v;
  recRepaint();
  var foc = f.edit === 'name' ? 'recName' : (f.edit === 'amt' ? 'recAmt' : (f.edit === 'freq' && f.freq !== 'weekly' ? 'recDay' : ''));  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): weekly ไม่มีช่องวันที่
  if (foc) focusInput(foc);
}
function recGuessPick(i, val){  // แตะชิปเดาคำ = แทนโทเคนนั้นในประโยคด้วยค่าที่เลือก แล้ว parse ใหม่
  var f = S.recForm; if (!f) return;
  recFlush(); recSyncInputs();
  var g = (f.guesses || [])[i];
  if (!g || f.type.slice(g.at, g.at + g.raw.length) !== g.raw) return;
  f.type = f.type.slice(0, g.at) + (val || g.fixed) + f.type.slice(g.at + g.raw.length);
  recApply(f);
  recRepaint();
}
function recGuessAll(){  // ✓ ใช้ตามนี้ — ยอมรับทุกคำที่เดา + หมวดที่เดา (คงค่าไว้ เคลียร์ธง)
  var f = S.recForm; if (!f) return;
  recFlush(); recSyncInputs();
  var gs = (f.guesses || []).slice(0).sort(function(a, b){ return b.at - a.at; });
  gs.forEach(function(g){
    if (f.type.slice(g.at, g.at + g.raw.length) === g.raw) f.type = f.type.slice(0, g.at) + g.fixed + f.type.slice(g.at + g.raw.length);
  });
  var keepCat = f.cat;
  recApply(f);
  if (keepCat){ f.cat = keepCat; f.catTouched = true; }
  f.catGuess = ''; f.guesses = [];
  recRepaint();
}
function recCatOk(){
  var f = S.recForm; if (!f) return;

  f.catTouched = true; f.catGuess = '';
  recRepaint();
}
function recFill(i){  // แตะ suggest/ชิป "รายการของฉัน" → ประกอบประโยค แล้ว parse ทางเดียวกับพิมพ์จริง
  var f = S.recForm, it = recRecall()[i]; if (!f || !it) return;

function recOpenExisting(rid, i){  // แตะ "มีอยู่แล้ว" → เลื่อนไปแถวเดิม + กางปุ่ม (โหมดแก้ไข = เฟสถัดไป)

function recOpen(){

  if (!S.recForm) S.recForm = recFormDefault();

}
function recSet(field, v){
  var f = S.recForm; if (!f) return;
  recFlush();  // แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): parse ข้อความค้างให้เสร็จก่อน แล้วค่อยทับด้วยชิป
  recSyncInputs();
  if (field === 'cat') { f.cat = (f.cat === v) ? '' : v; f.catTouched = true; f.catGuess = ''; }  // แตะซ้ำ = ยกเลิกเลือก · แตะเอง = ไม่ถูก guess ทับ
  else if (field === 'month') { f.month = parseInt(v, 10) || f.month; recDropWarn(f, 'month'); }
  else if (field === 'dow') { if (recDowOk(v)) f.dow = Number(v); recDropWarn(f, 'dow'); }  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69)
  else if (field === 'freq' && v === 'weekly') { f.freq = v; recDropWarn(f, 'freq'); recDropWarn(f, 'day'); recDropWarn(f, 'month'); }  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): weekly ไม่ใช้วันที่/เดือน
  else if (field === 'dir') { f.dir = v; if (v !== 'in' && f.cat === 'income') f.cat = ''; recDropWarn(f, 'dir'); }
  else { f[field] = v; recDropWarn(f, field); if (field === 'freq' && v === 'monthly') recDropWarn(f, 'month'); if (field === 'freq') recDropWarn(f, 'dow'); }  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): ออกจาก weekly → warn เลือกวันหาย
  paint();

function recSave(){
  var f = S.recForm; if (!f) return;
  recFlush();  // แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): Enter/กดเพิ่มระหว่าง debounce → parse ให้ทันก่อน
  recSyncInputs();
  // แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): ตรวจผ่าน recIssues ชุดเดียวกับสถานะปุ่ม (ข้อความเดิมของ v4.2 คงไว้)
  var iss = recIssues(f);
  if (iss.length){ toast(iss[0], true); return; }
  var name = String(f.name || '').replace(/\s+/g,' ').trim();
  var v = parseBahtMinor(f.amt);
  var day = parseInt(String(f.day).trim(), 10);
  var payload = { name: name, amount_minor: v, day: day, direction: f.dir === 'in' ? 'in' : 'out',
    freq: f.freq === 'yearly' ? 'yearly' : 'monthly', month: f.freq === 'yearly' ? f.month : null, category: f.cat || '' };
  // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): รายสัปดาห์ → { freq:'weekly', dow, day:null } (monthly/yearly payload เดิมเป๊ะ)
  var weekly = f.freq === 'weekly';
  if (weekly){ payload.freq = 'weekly'; payload.dow = Number(f.dow); payload.day = null; payload.month = null; }
  var snap = JSON.parse(JSON.stringify(f));  // แก้โดย CC — TASK_cc_fix_v42.md (3 ต.ค. 69): เก็บฟอร์มไว้ เปิดคืนถ้าบันทึกไม่สำเร็จ
  S.recForm = null;
  if (IS_DEMO){
    // เดโม่: เพิ่มในเครื่องเท่านั้น (ไม่ยิง network) — แสดงเฉพาะที่ถึงกำหนดเดือนนี้ เหมือน bridge
    var curM = new Date().getMonth() + 1;
    var lkey = 'local-' + Date.now();
    if (weekly){
      // แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): งวดนี้ = weeklyDueDate(วันนี้) · สถานะ pending (งวด ≤ วันนี้ — กติกาเดียวกับ computeFixed)
      var due = weeklyDueDate(payload.dow, todayISO());
      S.data.fixed = S.data.fixed || [];
      S.data.fixed.push({ key: lkey, label: name, emoji: '', logo: brandKey(name), amount_minor: v, day: parseInt(due.slice(8, 10), 10), dir: payload.direction,
        status: 'pending', date: '', spent_minor: 0, src: 'auto', freq: 'weekly', month_of_year: null, category: payload.category, dow: payload.dow, due: due });
    }
    else if (payload.freq !== 'yearly' || payload.month === curM){
      S.data.fixed = S.data.fixed || [];
      S.data.fixed.push({ key: lkey, label: name, emoji: '', logo: brandKey(name), amount_minor: v, day: day, dir: payload.direction,
        status: day <= new Date().getDate() ? 'pending' : 'wait', date: '', spent_minor: 0, src: 'auto',
        freq: payload.freq, month_of_year: payload.month, category: payload.category });
    }
    // แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): เดโม่จำชื่อใหม่ในเครื่อง → ขึ้น suggest ครั้งถัดไป (ทางเดียวกับ recall ของ bridge)
    S.data.recall = (S.data.recall || []).filter(function(r){ return recNorm(r.name) !== recNorm(name); });
    S.data.recall.unshift({ key: recNorm(name), name: name, brand: brandKey(name), cat: payload.category, amount_minor: v, day: day,
      dir: payload.direction, freq: payload.freq, month: payload.month, dow: weekly ? payload.dow : null, src: 'rec', hits: 0, isRec: true, rid: lkey });
    paint();
    toast('เพิ่มรายการประจำแล้ว ✓' + (payload.freq === 'yearly' && payload.month !== curM ? ' (จะขึ้นเดือน ' + TH_M[payload.month - 1] + ')' : ''));
    return;
  }
  paint();
  callAction('addRecurring', [payload], 'เพิ่มรายการประจำแล้ว ✓', function(){  // แก้โดย CC — TASK_cc_fix_v42.md (3 ต.ค. 69)
    if (!S.recForm) { S.recForm = snap; S.tab = 2; paint(); }
  });
}
function recDel(key){
  var d = S.data; if (!d || !d.fixed) return;
  var f = null;
  for (var i = 0; i < d.fixed.length; i++) if (d.fixed[i].key === key) f = d.fixed[i];
  if (!f) return;
  if (!confirm('ลบรายการประจำ "' + f.label + '" ?\nประวัติการยืนยันของรายการนี้จะถูกลบด้วย')) return;
  d.fixed = d.fixed.filter(function(x){ return x.key !== key; });
  if (S.fxOpen) delete S.fxOpen[key];
  paint();
  if (d.recall) d.recall.forEach(function(r){ if (r.rid === key){ r.isRec = false; r.rid = ''; } });  // แก้โดย CC — TASK_v42x_quickadd.md (3 ต.ค. 69): ลบแล้ว suggest ไม่ขึ้น "มีอยู่แล้ว"
  if (IS_DEMO){ toast('ลบแล้ว ✓'); return; }
  var id = parseInt(key, 10);
  callAction('removeRecurring', [id], 'ลบแล้ว ✓');
}
// แก้โดย CC — TASK_v42x_weekly.md (3 ต.ค. 69): inst = วันที่งวด (รายสัปดาห์) → ส่งเป็นอาร์กิวเมนต์ที่ 3 + อัปเดตเฉพาะแถวที่งวดตรง
// ไม่มี inst (monthly/yearly) → เรียกแบบเดิมเป๊ะ [key, v]
function ackFixedLocal(key, v, inst){
  var d = S.data; if (!d || !d.fixed) return;
  var args = inst ? [key, v, inst] : [key, v];
  if (v === 'auto'){
    toast('กำลังคืนเป็นอัตโนมัติ…');
    if (!IS_DEMO) callAction('ackFixed', inst ? [key, 'auto', inst] : [key, 'auto'], '');
    return;
  }
  for (var i = 0; i < d.fixed.length; i++){
    if (d.fixed[i].key === key && (!inst || d.fixed[i].due === inst)){
      d.fixed[i].status = v;
      d.fixed[i].src = 'ack';
      if (v === 'done') d.fixed[i].date = todayISO();
    }
  }
  paint();
  toast(v === 'done' ? 'บันทึกว่าจ่ายแล้ว ✓' : 'รับทราบ — รอต่อ');
  if (IS_DEMO) return;
  callAction('ackFixed', args, '');
}

/* ---------- บิลรอเงินคืน + รายรับ (ฝั่ง client — อัปเดตจอก่อนทันที ค่อยยิงเซิร์ฟเวอร์เบื้องหลัง) ---------- */
function billUpsertLocal(ref){
  var it = findItem(ref); if (!it) return;
  if (!S.data.bills) S.data.bills = [];
  if (!it.bill_status){ // เครื่องหมายถูกลบ — เอาออกจากลิสต์บิล
    S.data.bills = S.data.bills.filter(function(b){ return b.ref !== ref; });
    return;
  }
  var nm = it.display_name || it.counterparty || '';
  var entry = { ref: it.ref, name: nm, at: it.at, amount_minor: it.amount_minor,
    expect_minor: it.bill_expect || 0, returned_minor: it.bill_returned || 0,
    remaining_minor: Math.max(0, (it.bill_expect||0) - (it.bill_returned||0)), status: it.bill_status || '' };
  var found = null;
  for (var i=0;i<S.data.bills.length;i++) if (S.data.bills[i].ref === ref) found = S.data.bills[i];
  if (found){ for (var k in entry) found[k] = entry[k]; } else S.data.bills.push(entry);
}
function billSave(ref){
  var inp = el('billAmt');
  var v = parseBahtMinor(inp ? inp.value : '');
  if (!(v > 0)){ toast('ใส่ยอดรอคืนก่อนนะ', true); return; }
  var it = findItem(ref); if (!it) return;
  if (v > (it.amount_minor || 0)){ toast('ยอดรอคืนต้องไม่เกินยอดจ่าย', true); return; }
  delete S.billEdit[ref];
  it.bill_expect = v;
  it.bill_returned = it.bill_returned || 0;
  it.bill_status = (it.bill_returned >= v) ? 'done' : 'open';
  billUpsertLocal(ref);
  paint();
  toast('เปิดบิลรอคืน ' + fmtBaht(v) + '฿');
  if (IS_DEMO) return;
  callAction('markBill', [ref, v], '');
}
function retSave(ref){
  var inp = el('retAmt');
  var v = parseBahtMinor(inp ? inp.value : '');
  if (!(v > 0)){ toast('ใส่ยอดรับคืนก่อนนะ', true); return; }
  var it = findItem(ref); if (!it) return;
  var rem = (it.bill_expect || 0) - (it.bill_returned || 0);
  if (v > rem){ toast('รับคืนเกินยอดที่เหลือ (' + fmtBaht(rem) + '฿)', true); return; }
  delete S.billRet[ref];
  it.bill_returned = (it.bill_returned || 0) + v;
  if (it.bill_returned >= it.bill_expect) it.bill_status = 'done';
  billUpsertLocal(ref);
  paint();
  toast('รับคืน ' + fmtBaht(v) + '฿' + (it.bill_status === 'done' ? ' — ครบแล้ว ✓' : ''));
  if (IS_DEMO) return;
  callAction('addBillReturn', [ref, v], '');
}
function billClose(ref){
  var it = findItem(ref); if (!it) return;
  it.bill_status = 'closed';
  billUpsertLocal(ref);
  paint();
  toast('ปิดบิลแล้ว — ส่วนที่เหลือเป็นรายจ่ายจริง');
  if (IS_DEMO) return;
  callAction('closeBill', [ref], '');
}
function billUnmark(ref){
  var it = findItem(ref); if (!it) return;
  it.bill_expect = 0; it.bill_returned = 0; it.bill_status = '';
  billUpsertLocal(ref);
  paint();
  toast('ลบเครื่องหมายรอคืนแล้ว');
  if (IS_DEMO) return;
  callAction('unmarkBill', [ref], '');
}
function incSave(){
  var nm = el('incName'), amt = el('incAmt'), dt = el('incDate');
  var label = nm ? nm.value.replace(/\s+/g,' ').trim() : '';
  var v = parseBahtMinor(amt ? amt.value : '');
  var date = dt ? String(dt.value || '').trim() : '';
  if (!label){ toast('ใส่ชื่อรายรับด้วย', true); return; }
  if (!(v > 0)){ toast('ใส่จำนวนเงินด้วย', true); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('วันที่ไม่ถูกต้อง', true); return; }
  S.incForm = false;
  S.data.history.unshift({ at: date + 'T12:00:00', ref: 'MANIN-LOCAL-' + Date.now(), kind:'manual_in', direction:'in',
    amount_minor: v, counterparty: label, status:'saved', category:'income', saved_at:'', display_name:'' });
  S.data.summary.monthIncome = (S.data.summary.monthIncome || 0) + v;
  S.data.summary.cashflow = S.data.summary.monthIncome - S.data.summary.monthSpent;
  S.data.meta.savedCount = (S.data.meta.savedCount || 0) + 1;
  paint();
  toast('บันทึกรายรับ: ' + label + ' +' + fmtBaht(v) + '฿');
  if (IS_DEMO) return;
  callAction('appendIncome', [label, v, date], '');
}

/* แกะข้อความ statement → แถวดิบ [{at, direction, amount_minor, detail, wallet}]

     กติกาเดียวกับ personal_finance/tmn_statement.py: แถวยอดคงเหลือ/หัวกระดาษ = ข้าม,
     รายละเอียดที่ตัดบรรทัด = ต่อกัน (เพื่อให้ ref ตรงกับฝั่งคอม → กันซ้ำข้ามทาง)

var IMP_TMN_RE = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2}:\d{2})\s+(เงินเข้า|เงินออก)\s+(-?[\d,]+(?:\.\d+)?)\s*(.*)$/;
var IMP_BAL_RE = /^-?[\d,]+\.\d{2}(?:\s+-?[\d,]+\.\d{2})?$/;
var IMP_HDR = ['ใบแสดงรายการ','statement of account','ชื่อบัญชี','เลขที่บัญชี','รอบรายการ','ยอดคงเหลือ','วันที่ ประเภท','account name','account no','statement date'];
var IMP_SAMPLE = '12/09/2569 7-Eleven 45.00\n13/09/2569 รับเงิน โอนเข้า 2,500.00\n01/09/2026 13:46:40 เงินเข้า 300.00 kbankimobiledd01\n01/09/2026 13:47:26 เงินออก 224.00 im_onlinepayment_010000000000278672970\n02/09/2026 11:24:29 เงินออก 144.12 prepaidcard_master';
function impPad_(v){ return (v < 10 ? '0' : '') + v; }
function impParseText(text){
  var out = [], cur = null;
  var lines = String(text || '').split(/\r?\n/);
  for (var i = 0; i < lines.length; i++){
    var line = lines[i].replace(/^\s+|\s+$/g, '');
    if (!line) continue;

  return { at: y + '-' + impPad_(mo) + '-' + impPad_(dd) + 'T' + impPad_(hh) + ':' + impPad_(mi) + ':' + impPad_(ss),

}

  closeOtherReveals(null); // ปิดทุกแถวที่ค้างเปิด
}, { passive: true });
(function(){
  var m = /[?&]tab=([0-4])/.exec(location.search);
  if (m) S.tab = parseInt(m[1], 10);
})();
/* v3.2: ไฟล์ .txt/.csv ของหน้าต่างนำเข้า statement */
(function(){
  var fi = el('impFileIn');
  if (fi) fi.addEventListener('change', function(){
    var f = fi.files && fi.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      if (!S.imp) S.imp = { acct: 'kplus', text: '', rows: null, err: '' };
      S.imp.fileName = f.name; S.imp.pdfName = '';
      S.imp.text = String(rd.result || '');
      S.imp.rows = null; S.imp.err = '';
      renderImp();
    };
    rd.readAsText(f, 'utf-8');
    fi.value = '';
  });
  var ov = el('impov');
  if (ov) ov.addEventListener('click', function(e){ if (e.target === ov){ ov.classList.remove('on'); S.imp = null; } });
})();
/* v4.1: ไฟล์ PDF statement — อ่านดิบ → ถอดรหัสในเครื่อง (pdf.js) → ส่งขึ้นเฉพาะ "แถว" */
(function(){
  var fp = el('impPdfIn');
  if (fp) fp.addEventListener('change', function(){
    var f = fp.files && fp.files[0];
    fp.value = '';
    if (!f) return;
    if (!S.imp) S.imp = { acct: 'kplus', text: '', rows: null, err: '' };
    S.imp.pdfName = f.name; S.imp.fileName = '';
    S.imp.busy = true; S.imp.err = ''; S.imp.rows = null; S.imp.needPw = false;
    renderImp();
    var rd = new FileReader();
    rd.onload = function(){ impPdfStart(rd.result, f.name); };
    rd.onerror = function(){ if (S.imp){ S.imp.busy = false; S.imp.err = 'อ่านไฟล์ไม่ได้'; renderImp(); } };
    rd.readAsArrayBuffer(f);
  });
})();
/* เช็คอัปเดตเองทุกครั้งที่เปิด: iOS จำ HTML ของแอปหน้าจอโฮมไว้ ถ้าเจอเวอร์ชันใหม่ → เปิด URL ?v= ใหม่ (แคชคีย์ใหม่) ให้เลย */
(function(){
  setTimeout(function(){
    try {
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
        if (!j || !j.v || j.v === APP_BUILD) return;
        var gk = 'nkf_upd_' + j.v;
        try { if (sessionStorage.getItem(gk)) return; sessionStorage.setItem(gk, '1'); } catch (e2) {}
        var nv = String(j.v).replace(/[^0-9.]/g, '');
        try { toast('มีเวอร์ชันใหม่ — กำลังอัปเดต…'); } catch (e4) {}
        setTimeout(function(){
          location.replace(location.pathname + (nv ? '?v=' + nv : '') + (location.hash || ''));
        }, 350);
      }).catch(function(){});
    } catch (e3) {}
  }, 900);
})();
var POSE = /[?&]pose=([a-z]+)/.exec(location.search);
function bootAfterAuth(){
  reload(false);
  if (POSE){
    var _pv = 0, _pi = setInterval(function(){
      _pv++;
      if ((typeof S !== 'undefined' && S.data && S.data.mdet) || _pv > 40){ clearInterval(_pi); try { applyPose(POSE[1]); } catch (e) {} }
    }, 250);
  }
}
if (IS_DEMO) {
  render(DEMO);
  if (POSE) setTimeout(function(){ applyPose(POSE[1]); }, 140);
} else if (IS_SUPA) {
  // แก้โดย CC 23 ก.ย. 69 (TASK_p4_pwa_supabase): มี session → เข้าแอปเลย · ไม่มี → โชว์หน้าล็อกอิน
  // แก้โดย Hermes 28 ก.ย. 69 (forgot-password): แยกโหมด PASSWORD_RECOVERY — ต้องตั้งรหัสใหม่ก่อนเข้าแอป
  window.NKF_AUTH.init(function(session, evt){
    if (evt === 'PASSWORD_RECOVERY' || (!RECOVER.done && session && window.NKF_AUTH.initHashRecovery)) { enterRecover(); return; }
    if (session) { hideLogin(); hideRecover(); bootAfterAuth(); }
    else {
      showLogin();
      if (window.NKF_AUTH.initHashError) loginErr('ลิงก์ตั้งรหัสผ่านไม่ถูกต้องหรือใช้ไปแล้ว — กด "ลืมรหัสผ่าน?" เพื่อขอใหม่');
    }
  });
} else {
  bootAfterAuth();
}
</script>
